.timeline .event{position:relative;padding:0 0 18px 46px}.timeline .event:before{content:"";position:absolute;left:16px;top:32px;bottom:-4px;width:1px;background:var(--line)}.timeline .event:last-child:before{display:none}.event .ico{position:absolute;left:0;top:0}

<body>
<div class="app"><aside><div class="brand" id="brand"><div class="brandFallback">STOROJET<small>CRM</small></div></div><nav>
<button class="nav on" data-r="dashboard">⌂ Dashboard</button><button class="nav" data-r="contacts">🏢 Kontakte</button><button class="nav" data-r="todos">☑ Doings</button><button class="nav" data-r="projects">📁 Projekte</button><button class="nav" data-r="time" onclick="openTimeSection()">⏱ Zeiten</button><button class="nav" data-r="history">◷ Historie</button><button class="nav" data-r="settings">⚙ Einstellungen</button>
</nav></aside><main><div class="top"><div class="search"><input id="q" placeholder="Firma, Ansprechpartner, E-Mail, Telefon oder Inhalt suchen …"></div><button class="btn primary" id="quick">＋ Neuer Eintrag</button></div><div class="view" id="view"></div></main></div>
<dialog id="dlg"><div class="dlgHead"><b id="dlgTitle"></b><button class="btn" onclick="dlg.close()">✕</button></div><div class="dlgBody" id="dlgBody"></div><div class="dlgFoot" id="dlgFoot"></div></dialog>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<script>
const DB='storojet_crm_v3', STORE='state', projectPhases=['Vertrag zugesendet','Unterschrift vorhanden','Kick-Off','Warenanlieferung','Aufbau / Schnittstellenanbindung','Projektabnahme'], icons={phone:'📞',email_sent:'✉️',email_received:'📥',teams:'💻',onsite:'🤝',note:'📝',document:'📄',todo_done:'☑️',unknown:'◷'}, labels={phone:'Telefonat',email_sent:'E-Mail gesendet',email_received:'E-Mail erhalten',teams:'Teams-Meeting',onsite:'Vor-Ort-Termin',note:'Notiz',document:'Dokument',todo_done:'Doing erledigt',unknown:'Kontakt'};
let S={customers:[],todos:[],activities:[],projects:[],tasks:[],timeEntries:[],timeReports:[],settings:{sources:['Google','Website','LogiMAT','Empfehlung','Partner','Bestandskunde','LinkedIn','Telefonakquise','JTL Connect','medilox','Sonstiges'],stale:90},backups:[]}, route='dashboard', selected=null, contactMode='active', projectMode='active';
const $=s=>document.querySelector(s), esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])), uid=()=>crypto.randomUUID(), today=()=>new Date().toISOString().slice(0,10), dmy=v=>v?new Date(v.length===10?v+'T12:00:00':v).toLocaleDateString('de-DE'):'–', dt=v=>v?new Date(v).toLocaleString('de-DE',{dateStyle:'medium',timeStyle:'short'}):'–';
function db(){return new Promise((ok,no)=>{let r=indexedDB.open(DB,1);r.onupgradeneeded=()=>r.result.createObjectStore(STORE);r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}
async function load(){let d=await db();S=await new Promise((ok,no)=>{let t=d.transaction(STORE),r=t.objectStore(STORE).get('crm');r.onsuccess=()=>ok(r.result||S);r.onerror=()=>no(r.error)});normalize()}
async function save(){let d=await db();await new Promise((ok,no)=>{let t=d.transaction(STORE,'readwrite');t.objectStore(STORE).put(S,'crm');t.oncomplete=ok;t.onerror=()=>no(t.error)})}
function normalize(){S.customers=Array.isArray(S.customers)?S.customers:[];S.todos=Array.isArray(S.todos)?S.todos:[];S.activities=Array.isArray(S.activities)?S.activities:[];S.projects=Array.isArray(S.projects)?S.projects:[];S.tasks=Array.isArray(S.tasks)?S.tasks:[];S.timeEntries=Array.isArray(S.timeEntries)?S.timeEntries:[];S.timeReports=Array.isArray(S.timeReports)?S.timeReports:[];S.backups=Array.isArray(S.backups)?S.backups:[];S.settings??={};S.settings.sources??=['Google','Website','LogiMAT','Empfehlung','Sonstiges'];S.settings.stale??=90;S.settings.logoDataUrl??='';S.settings.darkMode??=false;S.settings.salesInitials??='JT'}
function applyBrand(){let b=$('#brand');if(!b)return;b.innerHTML=S.settings.logoDataUrl?'<img alt="Firmenlogo" src="'+S.settings.logoDataUrl+'"><small>CRM</small>':'<div class="brandFallback">STOROJET<small>CRM</small></div>'}
function applyTheme(){document.body.classList.toggle('dark',!!S.settings.darkMode)}
async function toggleTheme(){S.settings.darkMode=!S.settings.darkMode;applyTheme();await save()}
function activeCustomers(){return S.customers.filter(c=>!c.inactive)}
function inactiveCustomers(){return S.customers.filter(c=>!!c.inactive)}
function contactSortValue(c){let a=lastContact(c);return String(a?.at||c.lastContact||c.firstContact||'')}
function dueLimit(){let d=new Date();d.setDate(d.getDate()+2);return d.toISOString().slice(0,10)}
function relevantTodos(){let lim=dueLimit();return S.todos.filter(t=>!t.done&&t.due&&t.due<=lim&&S.customers.some(c=>c.id===t.customerId&&!c.inactive))}
function setContactMode(m){contactMode=m;selected=null;renderContacts()}
function siteUrl(v){if(!v)return'';return /^https?:\/\//i.test(v)?v:'https://'+v}
function localDateTimeValue(v){let d=v?new Date(String(v).length===10?v+'T12:00:00':v):new Date();if(Number.isNaN(d.getTime()))d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,16)}
function lastContact(c){let a=S.activities.filter(x=>x.customerId===c.id&&['phone','email_sent','email_received','teams','onsite'].includes(x.type)).sort((a,b)=>String(b.at).localeCompare(String(a.at)))[0];return a||null}
function nextTodo(c){return S.todos.filter(t=>t.customerId===c.id&&!t.done).sort((a,b)=>(a.due||'9999').localeCompare(b.due||'9999'))[0]||null}
function syncLegacy(){S.customers.forEach(c=>{if(c.notes&&!S.activities.some(a=>a._migrated===c.id)){c.notes.forEach(n=>S.activities.push({id:n.id||uid(),customerId:c.id,type:classify(n.content),at:n.date||new Date().toISOString(),text:n.content||'',_migrated:c.id}));if(c.reminderDate&&c.nextSteps&&!S.todos.some(t=>t._legacy===c.id))S.todos.push({id:uid(),customerId:c.id,title:c.nextSteps,due:c.reminderDate,done:false,_legacy:c.id})}})}
function classify(s=''){s=s.toLowerCase();if(s.includes('telefon'))return'phone';if(s.includes('teams'))return'teams';if(s.includes('vor ort')||s.includes('besichtigung'))return'onsite';if(s.includes('hallo ')||s.includes('guten tag')||s.includes('sehr geehrt'))return'email_sent';return'note'}
function inferLegacyProjectPhase(p){let cl=p?.checklist||{};if(['green','yellow'].includes(cl.phaseGoLive)||['green','yellow'].includes(cl.phaseClientOps)||['green','yellow'].includes(cl.phaseTest))return 5;if(['green','yellow'].includes(cl.phaseAssembly))return 4;if(['green','yellow'].includes(cl.phaseDelivery))return 3;if(['green','yellow'].includes(cl.phasePlanning))return 2;if(cl.contractPresent==='green')return 1;return 0}
function syncLegacyProjects(){S.customers.forEach(c=>{(c.projects||[]).forEach(p=>{if(S.projects.some(x=>x.id===p.id||x.legacyId===p.id))return;S.projects.push({id:p.id||uid(),legacyId:p.id||'',customerId:c.id,title:p.title||('STOROJET '+c.companyName),phase:inferLegacyProjectPhase(p),status:'active',projectManager:p.projectManager||'',accountManager:p.accountManager||'',client:p.client||'',targetDate:'',notes:p.specials||'',legacy:p})})})}
function notify(msg){let el=document.createElement('div');el.className='toast';el.textContent=msg;document.body.appendChild(el);setTimeout(()=>el.remove(),4200)}
function nav(r,id=null){route=r;selected=id;render()}
function openTimeSection(){route='time';selected=null;document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('on',b.dataset.r==='time'));try{timeView()}catch(e){console.error('Zeitansicht konnte nicht geöffnet werden',e);let v=$('#view');if(v)v.innerHTML='<div class="notice"><b>Zeitansicht konnte nicht geladen werden.</b><br>'+esc(e?.message||String(e))+'</div>'}}

function deDateToIsoDate(v){let m=String(v||'').match(/^(\d{2})\.(\d{2})\.(\d{4})$/);return m?m[3]+'-'+m[2]+'-'+m[1]:''}
function deDateTimeToIso(date,time){let d=deDateToIsoDate(date);if(!d)return'';let [y,m,day]=d.split('-').map(Number),[hh,mm]=String(time||'00:00').split(':').map(Number);return new Date(y,m-1,day,hh||0,mm||0,0).toISOString()}
function durationSeconds(h,m,s){return Number(h||0)*3600+Number(m||0)*60+Number(s||0)}
function secondsToHM(sec){sec=Math.max(0,Math.round(Number(sec)||0));let h=Math.floor(sec/3600),m=Math.floor((sec%3600)/60);return h+':'+String(m).padStart(2,'0')}
function currentMonthKey(){let d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}
function monthLabel(key){if(!/^\d{4}-\d{2}$/.test(key||''))return key||'';let [y,m]=key.split('-').map(Number);return new Date(y,m-1,1).toLocaleDateString('de-DE',{month:'long',year:'numeric'})}
function timeEntryMonth(e){let d=new Date(e?.start||'');if(Number.isNaN(d.getTime()))return'';return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}
function latestTimeReportForMonth(key){let reports=Array.isArray(S.timeReports)?S.timeReports:[];return [...reports].filter(r=>r&&(String(r.periodEnd||'').slice(0,7)===key||String(r.periodStart||'').slice(0,7)===key)).sort((a,b)=>String(b.importedAt||'').localeCompare(String(a.importedAt||''))||String(b.periodEnd||'').localeCompare(String(a.periodEnd||'')))[0]||null}
function monthTimeStats(key){let report=latestTimeReportForMonth(key);if(!report)return{entries:[],seconds:0,days:0,report:null};let entries=Array.isArray(report.entries)?report.entries.filter(e=>e&&e.start):[],seconds=Number.isFinite(Number(report.reportedSeconds))?Number(report.reportedSeconds):entries.reduce((n,e)=>n+(Number(e.durationSeconds)||0),0),days=Number(report.workDayCount)||0;if(!days&&entries.length)days=new Set(entries.map(e=>String(e.start).slice(0,10))).size;if(!days&&report.periodStart&&report.periodEnd){let legacy=(Array.isArray(S.timeEntries)?S.timeEntries:[]).filter(e=>e?.start&&String(e.start).slice(0,10)>=report.periodStart&&String(e.start).slice(0,10)<=report.periodEnd);days=new Set(legacy.map(e=>String(e.start).slice(0,10))).size}return{entries,seconds,days,report}}
function latestTimeReport(){let reports=Array.isArray(S.timeReports)?S.timeReports:[];return [...reports].filter(Boolean).sort((a,b)=>String(b.importedAt||'').localeCompare(String(a.importedAt||''))||String(b.periodEnd||'').localeCompare(String(a.periodEnd||'')))[0]||null}
function vacationBalance(){let r=latestTimeReport();return Number.isFinite(Number(r?.vacationBalance))?Number(r.vacationBalance):null}
function timeChartHtml(key){let st=monthTimeStats(key),entries=st.entries;if(!entries.length)return '<div class="empty" style="padding:28px 8px">Tagesdetails stehen ab dem nächsten Import dieser Auswertung zur Verfügung.</div>';let [y,m]=key.split('-').map(Number),daysInMonth=new Date(y,m,0).getDate(),daily={};entries.forEach(e=>{let d=new Date(e.start),day=d.getDate();daily[day]=(daily[day]||0)+(Number(e.durationSeconds)||0)});let max=Math.max(1,...Object.values(daily));let bars=[],labels=[];for(let day=1;day<=daysInMonth;day++){let sec=daily[day]||0,height=sec?Math.max(4,Math.round(sec/max*100)):2;bars.push('<div class="workBar" style="height:'+height+'%" data-tip="'+String(day).padStart(2,'0')+'. · '+secondsToHM(sec)+' h"></div>');labels.push('<span>'+([1,5,10,15,20,25,daysInMonth].includes(day)?day:'')+'</span>')}return '<div class="barArea">'+bars.join('')+'</div><div class="barLabels">'+labels.join('')+'</div>'}
function timeOverviewHtml(key){let st=monthTimeStats(key),vac=vacationBalance(),latest=latestTimeReport(),avg=st.days?Math.round(st.seconds/st.days):0;return '<div class="timeOverview"><div class="timeMetric"><div class="label">⏱ Ø Arbeitszeit pro Tag · '+esc(monthLabel(key))+'</div><div class="big">'+secondsToHM(avg)+' h</div><div class="label">'+(st.report?'Aus letzter Auswertung: '+secondsToHM(st.seconds)+' h / '+st.days+' Arbeitstag'+(st.days===1?'':'e'):'Noch keine Auswertung importiert')+'</div></div><div class="timeMetric"><div class="label">🏖 Resturlaub</div><div class="big">'+(vac===null?'–':vac.toLocaleString('de-DE',{minimumFractionDigits:vac%1?2:0,maximumFractionDigits:2})+' Tage')+'</div><div class="label">'+(latest?.periodEnd?'Stand '+dmy(latest.periodEnd):'Noch keine Auswertung importiert')+'</div></div><div class="timeChart"><div style="display:flex;justify-content:space-between;gap:10px"><b>Arbeitszeit pro Tag</b><span class="sub">'+esc(monthLabel(key))+'</span></div>'+timeChartHtml(key)+'</div></div>'}
function parseTimeReport(text){text=String(text||'').replace(/\r/g,'');let name=(text.match(/Arbeitszeiten für\s+([^\n]+)/i)||[])[1]?.trim()||'',workDayMatch=text.match(/(\d+)\s+Tage?\s+mit\s+Arbeitszeit-\(Start-\)-Buchungen/i),workDayCount=workDayMatch?Number(workDayMatch[1]):0,range=text.match(/(\d{2}\.\d{2}\.\d{4})\s*-\s*(\d{2}\.\d{2}\.\d{4})/),periodStart=range?deDateToIsoDate(range[1]):'',periodEnd=range?deDateToIsoDate(range[2]):'',entries=[],re=/(?:Mo|Di|Mi|Do|Fr|Sa|So)\s+(\d{2}\.\d{2}\.\d{4})\s+(\d{2}:\d{2})\s*-\s*(?:Mo|Di|Mi|Do|Fr|Sa|So)\s+(\d{2}\.\d{2}\.\d{4})\s+(\d{2}:\d{2})\s+(\d+):(\d{2}):(\d{2})/g,m;while((m=re.exec(text))){let start=deDateTimeToIso(m[1],m[2]),end=deDateTimeToIso(m[3],m[4]),seconds=durationSeconds(m[5],m[6],m[7]);entries.push({start,end,durationSeconds:seconds,key:start+'|'+end+'|'+seconds})}let total=text.match(/Arbeitszeit\s*%\s*Pausen:\s*(\d+):(\d{2}):(\d{2})/i),reportedSeconds=total?durationSeconds(total[1],total[2],total[3]):entries.reduce((n,e)=>n+e.durationSeconds,0),vac=text.match(/Aktueller Urlaubssaldo:\s*([\d.,]+)\s*Tage/i),vacationBalanceValue=vac?Number(vac[1].replace('.','').replace(',','.')):null;return{name,workDayCount,periodStart,periodEnd,entries,reportedSeconds,vacationBalance:vacationBalanceValue}}
async function importTimeReport(){let text=$('#timeImportText')?.value.trim();if(!text)return alert('Bitte zuerst die Zeitauswertung als Text einfügen.');let parsed=parseTimeReport(text);if(!parsed.entries.length&&parsed.vacationBalance===null)return alert('In diesem Text konnten keine Arbeitszeiten oder Urlaubsdaten erkannt werden.');let reportKey=(parsed.periodStart||'')+'|'+(parsed.periodEnd||''),old=S.timeReports.find(r=>r.reportKey===reportKey),report={id:old?.id||uid(),reportKey,name:parsed.name,workDayCount:parsed.workDayCount,periodStart:parsed.periodStart,periodEnd:parsed.periodEnd,reportedSeconds:parsed.reportedSeconds,vacationBalance:parsed.vacationBalance,entryCount:parsed.entries.length,entries:parsed.entries.map(e=>({...e})),importedAt:new Date().toISOString()};if(old)Object.assign(old,report);else S.timeReports.push(report);if(parsed.periodStart&&parsed.periodEnd){S.timeEntries=S.timeEntries.filter(e=>{let d=String(e?.start||'').slice(0,10);return !d||d<parsed.periodStart||d>parsed.periodEnd})}parsed.entries.forEach(e=>S.timeEntries.push({id:uid(),...e}));await save();notify('Zeitauswertung übernommen. Für die Anzeige zählt ausschließlich dieser aktuelle Auswertungsstand.');timeView(parsed.periodEnd?parsed.periodEnd.slice(0,7):currentMonthKey())}
function timeView(key=currentMonthKey()){if(!/^\d{4}-\d{2}$/.test(key||''))key=currentMonthKey();S.timeEntries=Array.isArray(S.timeEntries)?S.timeEntries:[];S.timeReports=Array.isArray(S.timeReports)?S.timeReports:[];let reports=[...S.timeReports].filter(Boolean).sort((a,b)=>String(b.periodEnd||'').localeCompare(String(a.periodEnd||''))),st=monthTimeStats(key);$('#view').innerHTML='<div class="head"><div><h1>Zeiten & Urlaub</h1><p>Arbeitszeitauswertungen aus den Firmenmails einlesen und Monatsstände verfolgen.</p></div><label style="display:grid;gap:5px;font-size:12px;color:var(--mut)">Monat<input type="month" value="'+esc(key)+'" onchange="timeView(this.value)" style="padding:9px 10px;border:1px solid var(--line);border-radius:9px;background:var(--surface);color:var(--txt)"></label></div>'+timeOverviewHtml(key)+'<div class="grid"><div class="sectionCard timeImport"><div class="sectionHead"><div><h2>📥 Auswertung einlesen</h2><div class="sub">Kompletten Text aus der E-Mail hier einfügen</div></div></div><div class="body"><textarea id="timeImportText" placeholder="Arbeitszeiten für Julian Trillken\n…"></textarea><div style="display:flex;justify-content:flex-end;margin-top:10px"><button class="btn primary" onclick="importTimeReport()">Auswertung übernehmen</button></div><p class="sub">Für die Anzeige wird immer nur die zuletzt importierte Auswertung des Monats verwendet. Frühere Zwischenstände werden nicht addiert.</p></div></div><div class="sectionCard"><div class="sectionHead"><div><h2>Historie der Auswertungen</h2><div class="sub">'+st.entries.length+' Buchungen im ausgewählten Monat</div></div></div><div class="body timeHistory">'+(reports.map(r=>'<div class="timeReport"><div><b>'+esc(r.periodStart?dmy(r.periodStart)+' – '+dmy(r.periodEnd):'Auswertung')+'</b><div class="sub">'+esc(r.name||'')+' · importiert '+dt(r.importedAt)+'</div></div><span>'+secondsToHM(r.reportedSeconds)+' h</span><span class="pill">'+(r.vacationBalance===null?'Urlaub –':Number(r.vacationBala function todos(){let rows=relevantTodos().sort((a,b)=>(a.due||'9999').localeCompare(b.due||'9999'));$('#view').innerHTML=`<div class="head"><div><h1>Doings</h1><p>Es werden nur überfällige, heute fällige und innerhalb der nächsten zwei Tage fällige Aufgaben angezeigt.</p></div><button class="btn primary" onclick="todoModal()">＋ Doing</button></div><div class="card"><div class="body">${rows.map(todoRow).join('')||'<div class="empty">Keine offenen Doings.</div>'}</div></div>`}

function setProjectMode(m){projectMode=m;projects()}
function projectTimeline(p){let phase=Number.isInteger(Number(p.phase))?Number(p.phase):-1,finished=p.status==='completed';return '<div class="projectTimeline">'+projectPhases.map((name,i)=>{let cls=finished?'done':i<phase?'past':i===phase?'current':'';return '<div class="phaseStep '+cls+'"><span class="phaseDot"></span>'+esc(name)+'</div>'}).join('')+'</div>'}
function projectPhaseBadge(p){let phase=Number(p.phase),name=projectPhases[phase]||'Phase festlegen';if(p.status==='completed')return '<span class="phaseBadge done">✓ Abgeschlossen</span>';return '<span class="phaseBadge '+(projectPhases[phase]?'':'unknown')+'">'+esc(name)+'</span>'}
function projects(){let rows=S.projects.filter(p=>(p.status||'active')===projectMode).sort((a,b)=>(a.targetDate||'9999').localeCompare(b.targetDate||'9999')||String(a.title||'').localeCompare(String(b.title||''),'de'));let activeCount=S.projects.filter(p=>(p.status||'active')==='active').length,doneCount=S.projects.filter(p=>p.status==='completed').length;$('#view').innerHTML=`<div class="head"><div><h1>Projekte</h1><p>Aktuelle STOROJET-Projekte und ihr Fortschritt.</p></div><button class="btn primary" onclick="projectModal()">＋ Projekt</button></div><div class="toolbar"><div class="tabs"><button class="tab ${projectMode==='active'?'on':''}" onclick="setProjectMode('active')">Laufend (${activeCount})</button><button class="tab ${projectMode==='completed'?'on':''}" onclick="setProjectMode('completed')">Abgeschlossen (${doneCount})</button></div></div><div class="projectList">${rows.map(p=>{let cust=S.customers.find(c=>c.id===p.customerId);return `<div class="projectCard"><div class="projectTop"><div><h3>${esc(p.title||'STOROJET Projekt')}</h3><div class="meta"><span class="click" onclick="nav('contacts','${p.customerId}')">🏢 ${esc(cust?.companyName||'Kein Kunde')}</span>${p.projectManager?'<span>👤 Projektleitung: '+esc(p.projectManager)+'</span>':''}${p.targetDate?'<span>📅 Ziel: '+dmy(p.targetDate)+'</span>':''}</div></div><div style="display:flex;gap:8px;align-items:center">${projectPhaseBadge(p)}<button class="btn" onclick="projectModal('${p.id}')">Bearbeiten</button></div></div>${projectTimeline(p)}${p.notes?'<div class="notice" style="margin:12px 0 0">'+esc(p.notes)+'</div>':''}</div>`}).join('')||'<div class="card"><div class="empty">'+(projectMode==='active'?'Keine laufenden Projekte.':'Keine abgeschlossenen Projekte.')+'</div></div>'}</div>`}
function projectModal(id){let p=S.projects.find(x=>x.id===id)||{phase:0,status:'active'},customers=[...S.customers].sort((a,b)=>a.companyName.localeCompare(b.companyName,'de'));let customerOpts=customers.map(c=>`<option value="${c.id}" ${c.id===p.customerId?'selected':''}>${esc(c.companyName)}${c.inactive?' (inaktiv)':''}</option>`).join(''),phaseOpts=projectPhases.map((x,i)=>`<option value="${i}" ${Number(p.phase)===i?'selected':''}>${i+1}. ${esc(x)}</option>`).join('');openDlg(id?'Projekt bearbeiten':'Projekt anlegen',`<div class="form"><label>Projektname<input id="pTitle" value="${esc(p.title||'')}" placeholder="z. B. STOROJET Meier Medizintechnik"></label><label>Kunde<select id="pCustomer"><option value="">Kunde auswählen …</option>${customerOpts}</select></label><div class="cols"><label>Aktuelle Phase<select id="pPhase">${phaseOpts}</select></label><label>Status<select id="pStatus"><option value="active" ${p.status!=='completed'?'selected':''}>Laufend</option><option value="completed" ${p.status==='completed'?'selected':''}>Abgeschlossen</option></select></label></div><div class="cols"><label>Projektleitung<input id="pManager" value="${esc(p.projectManager||'')}"></label><label>Account Manager<input id="pAccount" value="${esc(p.accountManager||'')}"></label></div><div class="cols"><label>Ansprechpartner Kunde<input id="pClient" value="${esc(p.client||'')}"></label><label>Zieltermin<input id="pTarget" type="date" value="${esc(p.targetDate||'')}"></label></div><label>Notiz / Besonderheiten<textarea id="pNotes">${esc(p.notes||'')}</textarea></label></div>`,`<button class="btn" onclick="dlg.close()">Abbrechen</button><button class="btn primary" onclick="saveProject('${id||''}')">Speichern</button>`)}
async function saveProject(id){let customerId=$('#pCustomer')?.value,title=$('#pTitle')?.value.trim();if(!customerId)return alert('Bitte einen Kunden auswählen.');if(!title)return alert('Bitte einen Projektnamen eingeben.');let p=id?S.projects.find(x=>x.id===id):{id:uid()};Object.assign(p,{customerId,title,phase:Number($('#pPhase').value),status:$('#pStatus').value,projectManager:$('#pManager').value.trim(),accountManager:$('#pAccount').value.trim(),client:$('#pClient').value.trim(),targetDate:$('#pTarget').value,notes:$('#pNotes').value.trim(),updatedAt:new Date().toISOString()});if(p.status==='completed')p.phase=projectPhases.length-1;if(!id)S.projects.push(p);await save();dlg.close();projectMode=p.status==='completed'?'completed':'active';projects();notify('Projekt gespeichert.')}
function history(){let rows=[...S.activities].sort((a,b)=>String(b.at).localeCompare(String(a.at)));$('#view').innerHTML=`<div class="head"><div><h1>Historie</h1><p>Telefonate, E-Mails, Teams-Meetings, Vor-Ort-Termine und Notizen.</p></div></div><div class="card"><div class="body">${rows.map(activityRow).join('')||'<div class="empty">Noch keine Aktivitäten.</div>'}</div></div>`}
function settings(){$('#view').innerHTML=`<div class="head"><div><h1>Einstellungen & Datensicherung</h1><p>Logo, Quellen, Geschäftsleitungs-Export, Import und lokale Browserdaten.</p></div></div>
<div class="grid" style="margin-bottom:18px">
<div class="card"><h2>🖼 Logo & Erscheinungsbild</h2><div class="body">
${S.settings.logoDataUrl?'<div style="background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px;text-align:center"><img src="'+S.settings.logoDataUrl+'" alt="Logo" style="max-width:240px;max-height:100px;object-fit:contain"></div>':'<p class="sub">Noch kein eigenes Logo hinterlegt.</p>'}
<p><input type="file" id="logoFile" accept="image/png,image/jpeg,image/webp,image/svg+xml"></p>
<button class="btn primary" onclick="uploadLogo()">Logo hochladen</button>
${S.settings.logoDataUrl?' <button class="btn danger" onclick="removeLogo()">Logo entfernen</button>':''}

<div style="display:flex;justify-content:space-between;gap:14px;align-items:center"><div><b>Darkmode</b><div class="sub">Aktuell: ${S.settings.darkMode?'aktiviert':'deaktiviert'}</div></div><button class="btn" onclick="toggleTheme();setTimeout(settings,0)">${S.settings.darkMode?'☀️ Lightmode aktivieren':'🌙 Darkmode aktivieren'}</button></div>
</div></div>
<div class="card"><h2>🏷 Kontaktquellen</h2><div class="body">
<div style="display:flex;gap:8px;margin-bottom:12px"><input id="newSource" placeholder="Neue Quelle, z. B. Messe" style="flex:1;padding:10px 11px;border:1px solid var(--line);border-radius:9px"><button class="btn primary" onclick="addSource()">Hinzufügen</button></div>
<div style="display:flex;flex-wrap:wrap;gap:8px">${S.settings.sources.map(s=>'<span class="pill" style="display:inline-flex;align-items:center;gap:7px">'+esc(s)+' <button title="Quelle entfernen" onclick="removeSource(\''+esc(s).replace(/'/g,"\\'")+'\')" style="border:0;background:transparent;color:inherit;cursor:pointer;font-weight:700">×</button></span>').join('')}</div>
<p class="sub" style="margin-top:12px">Neue Quellen stehen sofort bei allen Kunden zur Auswahl.</p>
</div></div></div>
<div class="card" style="margin-bottom:18px"><h2>📊 Geschäftsleitungs-Export – Kundenpotenziale</h2><div class="body">
<div class="cols"><label>VKKU / Kürzel<input id="salesInitials" value="${esc(S.settings.salesInitials||'JT')}" maxlength="12"></label><div style="align-self:end"><button class="btn" onclick="saveSalesInitials()">Kürzel speichern</button></div></div>
<p>Erzeugt eine Excel-Datei mit denselben 14 Spalten wie deine bisherige <b>Kundenpotenziale_SJ.xlsx</b>. Aktive und inaktive Kunden werden in getrennten Tabellenblättern ausgegeben.</p>
<p class="sub">„Aktueller Stand“ wird automatisch aus dem neuesten Historieneintrag des Kunden übernommen. Angebotsdaten, Sprinkler, Footprint, „Worauf wartet?“ und Produktionszulieferung werden in den Kundendaten gepflegt.</p>
<button class="btn primary" onclick="exportManagementXlsx()">⬇ Kundenpotenziale als Excel exportieren</button>
</div></div>
<div class="grid"><div class="card"><h2>Datenaustausch</h2><div class="body"><p>Deine Kundendaten werden nicht im GitHub-Repository gespeichert.</p><p><input type="file" id="imp" accept=".json"></p><button class="btn primary" onclick="importJson()">JSON importieren</button> <button class="btn" onclick="exportJson()">JSON exportieren</button></div></div><div class="card"><h2>Lokale Sicherung</h2><div class="body"><p>Kontakte: <b>${S.customers.length}</b><br>Historie: <b>${S.activities.length}</b><br>Doings: <b>${S.todos.length}</b></p><button class="btn" onclick="makeBackup()">Sicherungsstand erstellen</button> <button class="btn danger" onclick="clearAll()">Browserdaten löschen</button></div></div></div>`}
async function saveSalesInitials(){let v=$('#salesInitials')?.value.trim();S.settings.salesInitials=v||'JT';await save();notify('VKKU-Kürzel gespeichert.')}
function managementLatestStatus(c){let a=S.activities.filter(x=>x.customerId===c.id&&x.text&&x.type!=='todo_done'&&x.type!=='document').sort((a,b)=>String(b.at).localeCompare(String(a.at)))[0];return a?.text||c.info||''}
function managementDate(v){if(!v)return null;let d=new Date(String(v).length===10?v+'T12:00:00':v);return Number.isNaN(d.getTime())?null:d}
function managementSheet(customers){let headers=['Firma','Vkku','Erstkontakt','letzter Kontakt','SJ gesehen','1. Angebot','2. Angebot','Woher ?','Spinkler ?','Footprint','Worauf wartet? ','Produktionszulieferung','Branche','Aktueller Stand'];let rows=[...customers].sort((a,b)=>contactSortValue(b).localeCompare(contactSortValue(a))).map(c=>{let lc=lastContact(c);return[c.companyName||'',S.settings.salesInitials||'JT',managementDate(c.firstContact),managementDate(lc?.at||c.lastContact),c.sjSeen?'x':'',managementDate(c.firstOfferDate),managementDate(c.secondOfferDate),c.source||'',c.sprinkler||'',c.footprint||'',c.waitingFor||'',c.productionSupply||'',c.industry||'',managementLatestStatus(c)]});let ws=XLSX.utils.aoa_to_sheet([headers,...rows],{cellDates:true});ws['!cols']=[{wch:30},{wch:8},{wch:13},{wch:15},{wch:11},{wch:13},{wch:13},{wch:18},{wch:12},{wch:12},{wch:24},{wch:22},{wch:26},{wch:60}];ws['!autofilter']={ref:'A1:N'+Math.max(1,rows.length+1)};for(let r=2;r<=rows.length+1;r++){for(const col of ['C','D','F','G']){let cell=ws[col+r];if(cell&&cell.v instanceof Date)cell.z='dd.mm.yyyy'}}return ws}
async function exportManagementXlsx(){let initials=$('#salesInitials')?.value.trim();if(initials)S.settings.salesInitials=initials;await save();if(typeof XLSX==='undefined')return alert('Der Excel-Export konnte nicht geladen werden. Bitte Seite neu laden und erneut versuchen.');let wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,managementSheet(activeCustomers()),'Aktuell');XLSX.utils.book_append_sheet(wb,managementSheet(inactiveCustomers()),'nicht aktuelle Kunden');XLSX.writeFile(wb,'Kundenpotenziale_SJ_'+today()+'.xlsx',{compression:true,cellDates:true});notify('Excel-Export wurde erstellt.')}
async function uploadLogo(){let f=$('#logoFile')?.files?.[0];if(!f)return alert('Bitte zuerst eine Bilddatei auswählen.');if(f.size>3000000)return alert('Das Logo ist zu groß. Bitte eine Datei unter 3 MB verwenden.');let data=await new Promise((ok,no)=>{let r=new FileReader();r.onload=()=>ok(r.result);r.onerror=()=>no(r.error);r.readAsDataURL(f)});S.settings.logoDataUrl=data;await save();applyBrand();settings()}
async function removeLogo(){if(!confirm('Logo wirklich entfernen?'))return;S.settings.logoDataUrl='';await save();applyBrand();settings()}
async function addSource(){let el=$('#newSource'),v=el?.value.trim();if(!v)return;if(S.settings.sources.some(s=>s.toLowerCase()===v.toLowerCase()))return alert('Diese Quelle ist bereits vorhanden.');S.settings.sources.push(v);S.settings.sources.sort((a,b)=>a.localeCompare(b,'de'));await save();settings()}
async function removeSource(v){if(!S.settings.sources.includes(v))return;let used=S.customers.filter(c=>c.source===v).length;if(used&&!confirm('Die Quelle „'+v+'“ ist bei '+used+' Kunden hinterlegt. Sie wird nur aus der Auswahlliste entfernt; bestehende Kundenzuordnungen bleiben erhalten. Fortfahren?'))return;S.settings.sources=S.settings.sources.filter(s=>s!==v);await save();settings()}
function openDlg(title,body,foot){$('#dlgTitle').textContent=title;$('#dlgBody').innerHTML=body;$('#dlgFoot').innerHTML=foot;dlg.showModal()}
function customerModal(id){let c=S.customers.find(x=>x.id===id)||{};openDlg(id?'Unternehmen bearbeiten':'Unternehmen anlegen',`<div class="form"><div class="cols"><label>Firmenname<input id="fCompany" value="${esc(c.companyName||'')}"></label><label>Ansprechpartner<input id="fContact" value="${esc(c.contactPerson||'')}"></label></div><div class="cols"><label>E-Mail<input id="fEmail" value="${esc(c.email||'')}"></label><label>Telefon<input id="fPhone" value="${esc(c.phone||'')}"></label></div><div class="cols"><label>Website<input id="fWebsite" value="${esc(c.website||'')}" placeholder="www.beispiel.de"></label><label>Status<select id="fInactive"><option value="false" ${!c.inactive?'selected':''}>Aktiv</option><option value="true" ${c.inactive?'selected':''}>Inaktiv</option></select></label></div><div class="cols"><label>Branche<input id="fIndustry" value="${esc(c.industry||'')}"></label><label>Quelle<select id="fSource">${Array.from(new Set([...(S.settings.sources||[]),...(c.source?[c.source]:[])])).map(x=>`<option ${x===c.source?'selected':''}>${esc(x)}</option>`).join('')}</select></label></div><div class="cols"><label>Warenwirtschaft / ERP-System<input id="fErpSystem" value="${esc(c.erpSystem||'')}" placeholder="z. B. SAP, JTL, Microsoft Dynamics"></label><label style="align-content:end"><span style="display:flex;align-items:center;gap:9px;padding:10px 0"><input id="fSjSeen" type="checkbox" ${c.sjSeen?'checked':''} style="width:auto"> SJ gesehen</span></label></div>
<div class="sub" style="font-weight:700;margin-top:6px">Kundenpotenzial / Geschäftsleitungs-Export</div>

<div class="cols"><label>2. Angebot<input id="fSecondOffer" type="date" value="${esc(c.secondOfferDate||'')}"></label><label>Sprinkler?<select id="fSprinkler"><option value="" ${!c.sprinkler?'selected':''}>–</option><option value="Ja" ${c.sprinkler==='Ja'?'selected':''}>Ja</option><option value="Nein" ${c.sprinkler==='Nein'?'selected':''}>Nein</option><option value="?" ${c.sprinkler==='?'?'selected':''}>?</option></select></label></div>
<div class="cols"><label>Footprint<input id="fFootprint" value="${esc(c.footprint||'')}" placeholder="z. B. 404"></label><label>Worauf wartet?<input id="fWaitingFor" value="${esc(c.waitingFor||'')}" placeholder="z. B. Rückmeldung, Kundenformular"></label></div>
<label>Produktionszulieferung<input id="fProductionSupply" value="${esc(c.productionSupply||'')}" placeholder="z. B. Ja, Nein, evtl."></label>
<label>Adresse<textarea id="fAddress">${esc(c.address||'')}</textarea></label></div>`,`<button class="btn" onclick="dlg.close()">Abbrechen</button><button class="btn primary" onclick="saveCustomer('${id||''}')">Speichern</button>`)}
async function saveCustomer(id){let c=id?S.customers.find(x=>x.id===id):{id:uid(),firstContact:today(),additionalContacts:[]};Object.assign(c,{companyName:$('#fCompany').value.trim(),contactPerson:$('#fContact').value.trim(),email:$('#fEmail').value.trim(),phone:$('#fPhone').value.trim(),website:$('#fWebsite').value.trim(),inactive:$('#fInactive').value==='true',industry:$('#fIndustry').value.trim(),source:$('#fSource').value,erpSystem:$('#fErpSystem').value.trim(),sjSeen:$('#fSjSeen').checked,firstContact:$('#fFirstContact').value||c.firstContact||today(),firstOfferDate:$('#fFirstOffer').value,secondOfferDate:$('#fSecondOffer').value,sprinkler:$('#fSprinkler').value,footprint:$('#fFootprint').value.trim(),waitingFor:$('#fWaitingFor').value.trim(),productionSupply:$('#fProductionSupply').value.trim(),address:$('#fAddress').value.trim()});if(!id)S.customers.push(c);await save();dlg.close();nav('contacts',c.id)}
function activityModal(cid){let opts=S.customers.map(c=>`<option value="${c.id}" ${c.id===cid?'selected':''}>${esc(c.companyName)}</option>`).join('');openDlg('Aktivität erfassen',`<div class="form"><label>Unternehmen<select id="aCust">${opts}</select></label><div class="cols"><label>Art<select id="aType"><option value="phone">📞 Telefonat</option><option value="email_sent">✉️ E-Mail gesendet</option><option value="email_received">📥 E-Mail erhalten</option><option value="teams">💻 Teams-Meeting</option><option value="onsite">🤝 Vor-Ort-Termin</option><option value="note">📝 Notiz</option></select></label><label>Datum / Uhrzeit<input id="aDate" type="datetime-local" value="${localDateTimeValue()}"></label></div><label>Notiz<textarea id="aText"></textarea></label><label><input id="aTodo" type="checkbox"> Wiedervorlage direkt anlegen</label><div class="cols"><label>Doing<input id="aTodoTitle" placeholder="z.B. Nachfassen"></label><label>Fällig<input id="aDue" type="date"></label></div></div>`,`<button class="btn" onclick="dlg.close()">Abbrechen</button><button class="btn primary" onclick="saveActivity()">Speichern</button>`)}
function editActivityModal(id){let a=S.activities.find(x=>x.id===id);if(!a)return;let c=S.customers.find(x=>x.id===a.customerId);openDlg('Historieneintrag bearbeiten',`<div class="form"><label>Kunde<input value="${esc(c?.companyName||'')}" disabled></label><div class="cols"><label>Art<select id="eType"><option value="phone" ${a.type==='phone'?'selected':''}>📞 Telefonat</option><option value="email_sent" ${a.type==='email_sent'?'selected':''}>✉️ E-Mail gesendet</option><option value="email_received" ${a.type==='email_received'?'selected':''}>📥 E-Mail erhalten</option><option value="teams" ${a.type==='teams'?'selected':''}>💻 Teams-Meeting</option><option value="onsite" ${a.type==='onsite'?'selected':''}>🤝 Vor-Ort-Termin</option><option value="note" ${a.type==='note'?'selected':''}>📝 Notiz</option><option value="document" ${a.type==='document'?'selected':''}>📄 Dokument</option><option value="todo_done" ${a.type==='todo_done'?'selected':''}>☑️ Doing erledigt</option></select></label><label>Datum / Uhrzeit<input id="eDate" type="datetime-local" value="${localDateTimeValue(a.at)}"></label></div><label>Text<textarea id="eText">${esc(a.text||'')}</textarea></label></div>`,`<button class="btn" onclick="dlg.close()">Abbrechen</button><button class="btn primary" onclick="saveActivityEdit('${id}')">Änderungen speichern</button>`)}

async function saveActivity(){let cid=$('#aCust').value,a={id:uid(),customerId:cid,type:$('#aType').value,at:new Date($('#aDate').value).toISOString(),text:$('#aText').value.trim()};S.activities.push(a);if($('#aTodo').checked&&$('#aTodoTitle').value.trim())S.todos.push({id:uid(),customerId:cid,title:$('#aTodoTitle').value.trim(),due:$('#aDue').value,done:false});await save();dlg.close();nav('contacts',cid)}
function todoModal(cid){let customers=activeCustomers().sort((a,b)=>a.companyName.localeCompare(b.companyName,'de'));if(!customers.length)return alert('Es gibt aktuell keine aktiven Kunden für ein Doing.');let validCid=customers.some(c=>c.id===cid)?cid:'';let opts=customers.map(c=>`<option value="${c.id}" ${c.id===validCid?'selected':''}>${esc(c.companyName)}</option>`).join('');openDlg('Doing anlegen',`<div class="form"><label>Unternehmen<select id="tCust">${opts}</select></label><label>Aufgabe<input id="tTitle" placeholder="Was ist zu erledigen?" autofocus></label><label>Fällig<input id="tDue" type="date" value="${today()}"></label><div class="sub">Doings werden im Dashboard und in der Doing-Liste erst angezeigt, wenn sie überfällig, heute oder innerhalb der nächsten zwei Tage fällig sind.</div></div>`,`<button class="btn" onclick="dlg.close()">Abbrechen</button><button class="btn primary" onclick="saveTodo()">Speichern</button>`)}
function editTodoModal(id){let t=S.todos.find(x=>x.id===id);if(!t)return;let current=S.customers.find(c=>c.id===t.customerId),customers=activeCustomers().sort((a,b)=>a.companyName.localeCompare(b.companyName,'de'));if(current&&!customers.some(c=>c.id===current.id))customers.unshift(current);let opts=customers.map(c=>`<option value="${c.id}" ${c.id===t.customerId?'selected':''}>${esc(c.companyName)}${c.inactive?' (inaktiv)':''}</option>`).join('');openDlg('Doing bearbeiten',`<div class="form"><label>Unternehmen<select id="teCust">${opts}</select></label><label>Aufgabe<input id="teTitle" value="${esc(t.title||'')}"></label><label>Fällig<input id="teDue" type="date" value="${esc(t.due||today())}"></label></div>`,`<button class="btn" onclick="dlg.close()">Abbrechen</button><button class="btn primary" onclick="saveTodoEdit('${id}')">Änderungen speichern</button>`)}
async function saveTodoEdit(id){let t=S.todos.find(x=>x.id===id);if(!t)return;let cid=$('#teCust')?.value,title=$('#teTitle')?.value.trim(),due=$('#teDue')?.value,cust=S.customers.find(x=>x.id===cid);if(!cust)return alert('Bitte einen Kunden auswählen.');if(cust.inactive&&cid!==t.customerId)return alert('Doings können nur aktiven Kunden neu zugeordnet werden.');if(!title)return alert('Bitte eine Aufgabe eingeben.');if(!due)return alert('Bitte ein Fälligkeitsdatum auswählen.');t.customerId=cid;t.title=title;t.due=due;t.updatedAt=new Date().toISOString();await save();dlg.close();render();notify('Doing aktualisiert.')}
function completeTodoModal(id){let t=S.todos.find(x=>x.id===id);if(!t)return;let c=S.customers.find(x=>x.id===t.customerId);openDlg('Doing erledigen',`<div class="form"><label>Kunde<input value="${esc(c?.companyName||'')}" disabled></label><label>Doing<input value="${esc(t.title||'')}" disabled></label><label>Abschlussnotiz<textarea id="tdNote" placeholder="Was wurde erledigt? Ergebnis, Rückmeldung oder weitere wichtige Information …"></textarea></label><div class="sub">Die Notiz wird zusammen mit dem erledigten Doing in der Kundenhistorie gespeichert.</div></div>`,`<button class="btn" onclick="dlg.close()">Abbrechen</button><button class="btn primary" onclick="completeTodo('${id}')">Als erledigt speichern</button>`)}
async function completeTodo(id){let t=S.todos.find(x=>x.id===id);if(!t)return;let note=$('#tdNote')?.value.trim()||'',doneAt=new Date().toISOString();t.done=true;t.doneAt=doneAt;t.completionNote=note;let text='Doing erledigt: '+t.title+(note?'\n\nAbschlussnotiz: '+note:'');S.activities.push({id:uid(),customerId:t.customerId,type:'todo_done',at:doneAt,text,todoId:t.id});await save();dlg.close();render();notify('Doing als erledigt gespeichert.')}
async function deleteTodo(id){let t=S.todos.find(x=>x.id===id);if(!t)return;if(!confirm('Doing „'+t.title+'“ wirklich löschen?'))return;S.todos=S.todos.filter(x=>x.id!==id);await save();render();notify('Doing gelöscht.')}
async function saveTodo(){let cid=$('#tCust')?.value,title=$('#tTitle')?.value.trim(),due=$('#tDue')?.value,c=S.customers.find(x=>x.id===cid);if(!c||c.inactive)return alert('Doings können nur für aktive Kunden angelegt werden.');if(!title)return alert('Bitte eine Aufgabe eingeben.');if(!due)return alert('Bitte ein Fälligkeitsdatum auswählen.');let item={id:uid(),customerId:cid,title,due,done:false,createdAt:new Date().toISOString()};S.todos.push(item);await save();dlg.close();render();if(due>dueLimit()){let visible=new Date(due+'T12:00:00');visible.setDate(visible.getDate()-2);notify('Doing gespeichert. Es wird ab '+visible.toLocaleDateString('de-DE')+' in der Doing-Ansicht angezeigt.')}else notify('Doing gespeichert.')}
function doneTodo(id){completeTodoModal(id)}
async function importJson(){let f=$('#imp').files[0];if(!f)return alert('Bitte JSON-Datei auswählen.');let x=JSON.parse(await f.text());S.customers=x.customers||[];S.todos=x.todos||[];S.activities=x.activities||[];S.tasks=x.tasks||[];S.timeEntries=x.timeEntries||[];S.timeReports=x.timeReports||[];S.settings={...S.settings,...(x.settings||{})};S.projects=x.projects||[];syncLegacy();syncLegacyProjects();await save();alert('Import abgeschlossen: '+S.customers.length+' Kontakte.');render()}
function exportJson(){let blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='STOROJET_CRM_Backup_'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
async function makeBackup(){S.backups.push({at:new Date().toISOString(),data:JSON.parse(JSON.stringify({customers:S.customers,todos:S.todos,activities:S.activities,projects:S.projects,tasks:S.tasks,timeEntries:S.timeEntries,timeReports:S.timeReports,settings:S.settings}))});S.backups=S.backups.slice(-10);await save();alert('Lokaler Sicherungsstand erstellt.')}
async function clearAll(){if(!confirm('Wirklich alle lokalen CRM-Daten in diesem Browser löschen?'))return;S={customers:[],todos:[],activities:[],projects:[],tasks:[],timeEntries:[],timeReports:[],settings:{sources:['Google','Website','LogiMAT','Empfehlung','Sonstiges'],stale:90},backups:[]};await save();render()}
async function cleanupLegacyAppCache(){try{if('serviceWorker' in navigator){let regs=await navigator.serviceWorker.getRegistrations();for(const reg of regs)await reg.unregister()}if('caches' in window){let keys=await caches.keys();for(const key of keys){if(key.startsWith('crm-pro-cache'))await caches.delete(key)}}}catch(e){console.warn('Cache-Bereinigung nicht möglich',e)}}
load().then(async()=>{await cleanupLegacyAppCache();syncLegacy();syncLegacyProjects();await save();render()});
</script>
</body></html>

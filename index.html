<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1b3b8f"><title>STOROJET CRM</title>
<style>
:root{--g:#1b3b8f;--g2:#eef2ff;--bg:#f5f6f8;--txt:#2b2d33;--mut:#6d7078;--red:#c83a3a;--amber:#c98212;--line:#dfe2e8}
*{box-sizing:border-box}body{margin:0;font:14px/1.45 system-ui,-apple-system,Segoe UI,Arial;color:var(--txt);background:var(--bg)}
button,input,select,textarea{font:inherit}button{cursor:pointer}.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
aside{background:#242833;color:#fff;padding:18px 14px;display:flex;flex-direction:column;gap:18px}.brand{background:#fff;border-radius:14px;padding:10px;text-align:center;min-height:72px;display:grid;place-items:center}.brand img{display:block;width:100%;max-width:160px;max-height:88px;object-fit:contain;margin:auto;border-radius:8px}.brandFallback{font-weight:800;font-size:20px;color:#1b3b8f}.brand small{display:block;margin-top:5px;font-size:10px;letter-spacing:2px;color:#6d7078}
nav{display:grid;gap:7px}.nav{border:0;background:transparent;color:#e4e6ec;padding:11px 12px;border-radius:10px;text-align:left}.nav:hover,.nav.on{background:#1b3b8f;color:#fff}
main{min-width:0}.top{height:74px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 26px;position:sticky;top:0;z-index:4}
.search{flex:1;max-width:760px}.search input{width:100%;padding:12px 15px;border:1px solid var(--line);border-radius:12px;background:#fafcfc}
.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 13px}.btn.primary{background:var(--g);color:#fff;border-color:var(--g)}.btn.danger{color:var(--red)}
.view{padding:26px;max-width:1500px;margin:auto}.head{display:flex;justify-content:space-between;gap:15px;align-items:flex-end;margin-bottom:20px}.head h1{margin:0;font-size:28px}.head p{margin:4px 0 0;color:var(--mut)}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:18px}.tile,.card{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 3px 12px #102a2509}.tile{padding:18px}.tile b{display:block;font-size:28px}.tile span{color:var(--mut)}.tile.red{border-left:5px solid var(--red)}.tile.amber{border-left:5px solid var(--amber)}.tile.green{border-left:5px solid var(--g)}
.grid{display:grid;grid-template-columns:1.4fr .8fr;gap:18px}.card h2{margin:0;padding:16px 18px;border-bottom:1px solid var(--line);font-size:16px}.body{padding:10px 18px}.row{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start;padding:12px 0;border-bottom:1px solid #edf1ef}.row:last-child{border:0}.ico{width:34px;height:34px;border-radius:10px;background:var(--g2);display:grid;place-items:center}.title{font-weight:700}.sub{color:var(--mut);font-size:12px}.due{font-size:12px;padding:4px 8px;border-radius:999px;background:#eef3f1}.due.red{background:#fdeaea;color:#a52525}.due.today{background:#fff2db;color:#915b00}
.toolbar{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}.toolbar input,.toolbar select,.form input,.form select,.form textarea{padding:10px 11px;border:1px solid var(--line);border-radius:9px;background:#fff}.toolbar input{min-width:300px;flex:1}.typeahead{position:relative}.typeahead input{width:100%}.suggestions{display:none;position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:20;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px #0002;max-height:240px;overflow:auto}.suggestions.show{display:block}.suggestion{padding:10px 12px;cursor:pointer;border-bottom:1px solid #edf1ef}.suggestion:last-child{border-bottom:0}.suggestion:hover{background:var(--g2)}.tabs{display:flex;gap:7px}.tab{border:1px solid var(--line);background:#fff;padding:9px 13px;border-radius:999px}.tab.on{background:var(--g);border-color:var(--g);color:#fff}.mail,.web{color:var(--g);text-decoration:none}.mail:hover,.web:hover{text-decoration:underline}
.table{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:auto}table{border-collapse:collapse;width:100%}th,td{padding:12px 14px;text-align:left;border-bottom:1px solid #edf1ef}th{font-size:12px;color:var(--mut);background:#fafcfc}.click{cursor:pointer}.click:hover{background:#f8fbfa}
.customerHero{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:16px}.customerHero h1{margin:0 0 4px}.meta{display:flex;gap:12px;flex-wrap:wrap;color:var(--mut)}.projectList{display:grid;gap:16px}.projectCard{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 3px 12px #102a2509}.projectTop{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:16px}.projectTop h3{margin:0 0 4px;font-size:18px}.phaseBadge{display:inline-flex;align-items:center;gap:7px;padding:6px 10px;border-radius:999px;font-size:12px;font-weight:700;background:#eef2ff;color:#1b3b8f}.phaseBadge.unknown{background:#f1f2f4;color:#6d7078}.phaseBadge.done{background:#e7f6ee;color:#18794e}.projectTimeline{display:grid;grid-template-columns:repeat(6,minmax(100px,1fr));gap:0;margin:14px 0 8px;overflow-x:auto;padding-bottom:4px}.phaseStep{position:relative;text-align:center;min-width:105px;padding:30px 6px 0;font-size:11px;color:var(--mut)}.phaseStep:before{content:'';position:absolute;top:10px;left:0;right:0;height:4px;background:#e1e4e9}.phaseStep:first-child:before{left:50%}.phaseStep:last-child:before{right:50%}.phaseDot{position:absolute;top:3px;left:50%;transform:translateX(-50%);width:18px;height:18px;border-radius:50%;background:#d6d9df;border:3px solid #fff;box-shadow:0 0 0 1px #c9cdd5;z-index:2}.phaseStep.past:before,.phaseStep.current:before{background:#73a5e8}.phaseStep.past .phaseDot{background:#1b3b8f;box-shadow:0 0 0 1px #1b3b8f}.phaseStep.current .phaseDot{background:#f0a125;box-shadow:0 0 0 2px #f0a125}.phaseStep.current{color:#2b2d33;font-weight:700}.phaseStep.done:before{background:#41a56e}.phaseStep.done .phaseDot{background:#23885a;box-shadow:0 0 0 1px #23885a}
.timeline .event{position:relative;padding:0 0 18px 46px}.timeline .event:before{content:"";position:absolute;left:16px;top:32px;bottom:-4px;width:1px;background:var(--line)}.timeline .event:last-child:before{display:none}.event .ico{position:absolute;left:0;top:0}
.form{display:grid;gap:11px}.form label{display:grid;gap:5px;font-size:12px;color:var(--mut)}.form textarea{min-height:110px;resize:vertical}.cols{display:grid;grid-template-columns:1fr 1fr;gap:11px}
dialog{border:0;border-radius:16px;padding:0;max-width:660px;width:calc(100% - 28px);box-shadow:0 30px 90px #0004}dialog::backdrop{background:#0006}.dlgHead,.dlgFoot{padding:15px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.dlgFoot{border-top:1px solid var(--line);border-bottom:0;justify-content:flex-end;gap:8px}.dlgBody{padding:18px}
.notice{background:#eef2ff;border:1px solid #cbd5f5;border-radius:14px;padding:16px;margin-bottom:18px}.toast{position:fixed;right:22px;bottom:22px;z-index:100;background:#242833;color:#fff;padding:12px 16px;border-radius:12px;box-shadow:0 12px 34px #0004;max-width:420px}.empty{padding:28px;text-align:center;color:var(--mut)}.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:var(--g2);color:var(--g);font-size:12px}
@media(max-width:900px){.app{grid-template-columns:1fr}aside{position:static;display:block;padding:12px}.brand{margin-bottom:10px}nav{display:flex;overflow:auto}.nav{white-space:nowrap}.top{padding:0 12px}.view{padding:16px}.tiles{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}.cols{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app"><aside><div class="brand" id="brand"><div class="brandFallback">STOROJET<small>CRM</small></div></div><nav>
<button class="nav on" data-r="dashboard">⌂ Dashboard</button><button class="nav" data-r="contacts">🏢 Kontakte</button><button class="nav" data-r="todos">☑ Doings</button><button class="nav" data-r="projects">📁 Projekte</button><button class="nav" data-r="history">◷ Historie</button><button class="nav" data-r="settings">⚙ Einstellungen</button>
</nav></aside><main><div class="top"><div class="search"><input id="q" placeholder="Firma, Ansprechpartner, E-Mail, Telefon oder Inhalt suchen …"></div><button class="btn primary" id="quick">＋ Neuer Eintrag</button></div><div class="view" id="view"></div></main></div>
<dialog id="dlg"><div class="dlgHead"><b id="dlgTitle"></b><button class="btn" onclick="dlg.close()">✕</button></div><div class="dlgBody" id="dlgBody"></div><div class="dlgFoot" id="dlgFoot"></div></dialog>
<script>
const DB='storojet_crm_v3', STORE='state', projectPhases=['Vertrag zugesendet','Unterschrift vorhanden','Kick-Off','Warenanlieferung','Aufbau / Schnittstellenanbindung','Projektabnahme'], icons={phone:'📞',email_sent:'✉️',email_received:'📥',teams:'💻',onsite:'🤝',note:'📝',document:'📄',todo_done:'☑️',unknown:'◷'}, labels={phone:'Telefonat',email_sent:'E-Mail gesendet',email_received:'E-Mail erhalten',teams:'Teams-Meeting',onsite:'Vor-Ort-Termin',note:'Notiz',document:'Dokument',todo_done:'Doing erledigt',unknown:'Kontakt'};
let S={customers:[],todos:[],activities:[],projects:[],settings:{sources:['Google','Website','LogiMAT','Empfehlung','Partner','Bestandskunde','LinkedIn','Telefonakquise','JTL Connect','medilox','Sonstiges'],stale:90},backups:[]}, route='dashboard', selected=null, contactMode='active', projectMode='active';
const $=s=>document.querySelector(s), esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])), uid=()=>crypto.randomUUID(), today=()=>new Date().toISOString().slice(0,10), dmy=v=>v?new Date(v.length===10?v+'T12:00:00':v).toLocaleDateString('de-DE'):'–', dt=v=>v?new Date(v).toLocaleString('de-DE',{dateStyle:'medium',timeStyle:'short'}):'–';
function db(){return new Promise((ok,no)=>{let r=indexedDB.open(DB,1);r.onupgradeneeded=()=>r.result.createObjectStore(STORE);r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}
async function load(){let d=await db();S=await new Promise((ok,no)=>{let t=d.transaction(STORE),r=t.objectStore(STORE).get('crm');r.onsuccess=()=>ok(r.result||S);r.onerror=()=>no(r.error)});normalize()}
async function save(){let d=await db();await new Promise((ok,no)=>{let t=d.transaction(STORE,'readwrite');t.objectStore(STORE).put(S,'crm');t.oncomplete=ok;t.onerror=()=>no(t.error)})}
function normalize(){S.customers??=[];S.todos??=[];S.activities??=[];S.projects??=[];S.backups??=[];S.settings??={};S.settings.sources??=['Google','Website','LogiMAT','Empfehlung','Sonstiges'];S.settings.stale??=90;S.settings.logoDataUrl??=''}
function applyBrand(){let b=$('#brand');if(!b)return;b.innerHTML=S.settings.logoDataUrl?'<img alt="Firmenlogo" src="'+S.settings.logoDataUrl+'"><small>CRM</small>':'<div class="brandFallback">STOROJET<small>CRM</small></div>'}
function activeCustomers(){return S.customers.filter(c=>!c.inactive)}
function inactiveCustomers(){return S.customers.filter(c=>!!c.inactive)}
function contactSortValue(c){let a=lastContact(c);return String(a?.at||c.lastContact||c.firstContact||'')}
function dueLimit(){let d=new Date();d.setDate(d.getDate()+2);return d.toISOString().slice(0,10)}
function relevantTodos(){let lim=dueLimit();return S.todos.filter(t=>!t.done&&t.due&&t.due<=lim&&S.customers.some(c=>c.id===t.customerId&&!c.inactive))}
function setContactMode(m){contactMode=m;selected=null;renderContacts()}
function siteUrl(v){if(!v)return'';return /^https?:\/\//i.test(v)?v:'https://'+v}
function localDateTimeValue(v){let d=v?new Date(String(v).length===10?v+'T12:00:00':v):new Date();if(Number.isNaN(d.getTime()))d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,16)}
function lastContact(c){let a=S.activities.filter(x=>x.customerId===c.id&&['phone','email_sent','email_received','teams','onsite'].includes(x.type)).sort((a,b)=>String(b.at).localeCompare(String(a.at)))[0];return a||null}
function nextTodo(c){return relevantTodos().filter(t=>t.customerId===c.id).sort((a,b)=>(a.due||'9999').localeCompare(b.due||'9999'))[0]||null}
function syncLegacy(){S.customers.forEach(c=>{if(c.notes&&!S.activities.some(a=>a._migrated===c.id)){c.notes.forEach(n=>S.activities.push({id:n.id||uid(),customerId:c.id,type:classify(n.content),at:n.date||new Date().toISOString(),text:n.content||'',_migrated:c.id}));if(c.reminderDate&&c.nextSteps&&!S.todos.some(t=>t._legacy===c.id))S.todos.push({id:uid(),customerId:c.id,title:c.nextSteps,due:c.reminderDate,done:false,_legacy:c.id})}})}
function classify(s=''){s=s.toLowerCase();if(s.includes('telefon'))return'phone';if(s.includes('teams'))return'teams';if(s.includes('vor ort')||s.includes('besichtigung'))return'onsite';if(s.includes('hallo ')||s.includes('guten tag')||s.includes('sehr geehrt'))return'email_sent';return'note'}
function inferLegacyProjectPhase(p){let cl=p?.checklist||{};if(['green','yellow'].includes(cl.phaseGoLive)||['green','yellow'].includes(cl.phaseClientOps)||['green','yellow'].includes(cl.phaseTest))return 5;if(['green','yellow'].includes(cl.phaseAssembly))return 4;if(['green','yellow'].includes(cl.phaseDelivery))return 3;if(['green','yellow'].includes(cl.phasePlanning))return 2;if(cl.contractPresent==='green')return 1;return 0}
function syncLegacyProjects(){S.customers.forEach(c=>{(c.projects||[]).forEach(p=>{if(S.projects.some(x=>x.id===p.id||x.legacyId===p.id))return;S.projects.push({id:p.id||uid(),legacyId:p.id||'',customerId:c.id,title:p.title||('STOROJET '+c.companyName),phase:inferLegacyProjectPhase(p),status:'active',projectManager:p.projectManager||'',accountManager:p.accountManager||'',client:p.client||'',targetDate:'',notes:p.specials||'',legacy:p})})})}
function notify(msg){let el=document.createElement('div');el.className='toast';el.textContent=msg;document.body.appendChild(el);setTimeout(()=>el.remove(),4200)}
function nav(r,id=null){route=r;selected=id;render()}
document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>nav(b.dataset.r));$('#quick').onclick=()=>activityModal();
$('#q').oninput=e=>{let q=e.target.value.trim().toLowerCase();if(!q)return;route='contacts';selected=null;renderContacts(q)}
function render(){applyBrand();document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('on',b.dataset.r===route));if(route==='dashboard')dashboard();if(route==='contacts')selected?customer(selected):renderContacts();if(route==='todos')todos();if(route==='projects')projects();if(route==='history')history();if(route==='settings')settings()}
function dashboard(){let ac=activeCustomers(),open=relevantTodos(),td=today(),w=dueLimit(),nextAll=S.todos.filter(t=>!t.done&&t.due&&t.due>=td&&S.customers.some(c=>c.id===t.customerId&&!c.inactive)).sort((a,b)=>(a.due||'9999').localeCompare(b.due||'9999')).slice(0,10), stale=ac.map(c=>({c,a:lastContact(c)})).filter(x=>x.a&&((Date.now()-new Date(x.a.at))/864e5)>=S.settings.stale).sort((a,b)=>String(a.a.at).localeCompare(String(b.a.at))).slice(0,8);
$('#view').innerHTML=`<div class="head"><div><h1>Dashboard</h1><p>Kontakte, Historie und Nachverfolgung auf einen Blick.</p></div><span class="pill">${ac.length} aktive Kontakte</span></div>
${!S.customers.length?'<div class="notice"><b>Noch keine Daten vorhanden.</b><br>Importiere dein vorhandenes JSON-Backup unter Einstellungen. Die Daten bleiben ausschließlich in diesem Browser.</div>':''}
<div class="tiles"><div class="tile red"><b>${open.filter(t=>t.due&&t.due<td).length}</b><span>Überfällig</span></div><div class="tile amber"><b>${open.filter(t=>t.due===td).length}</b><span>Heute</span></div><div class="tile"><b>${open.filter(t=>t.due>td&&t.due<=w).length}</b><span>In 1–2 Tagen</span></div><div class="tile green"><b>${S.todos.filter(t=>t.done&&t.doneAt?.slice(0,10)===td).length}</b><span>Heute erledigt</span></div></div>
<div class="grid"><div class="card"><h2>☑ Offene Doings</h2><div class="body">${open.sort((a,b)=>(a.due||'9999').localeCompare(b.due||'9999')).slice(0,12).map(todoRow).join('')||'<div class="empty">Keine offenen Doings.</div>'}</div></div>
<div><div class="card" style="margin-bottom:18px"><h2>⏭ Nächste Doings</h2><div class="body">${nextAll.map(todoRow).join('')||'<div class="empty">Keine kommenden Doings.</div>'}</div></div>
<div class="card" style="margin-bottom:18px"><h2>⚠ Kontakt prüfen</h2><div class="body">${stale.map(x=>`<div class="row click" onclick="nav('contacts','${x.c.id}')"><div class="ico">${icons[x.a.type]}</div><div><div class="title">${esc(x.c.companyName)}</div><div class="sub">Letzter Kontakt ${dmy(x.a.at)}</div></div></div>`).join('')||'<div class="empty">Keine auffälligen Kontakte.</div>'}</div></div>
<div class="card"><h2>📝 Schnellnotiz</h2><div class="body"><div class="form"><label>Kunde<div class="typeahead"><input id="qnCustomerInput" placeholder="Kundennamen eingeben …" autocomplete="off" oninput="renderQuickCustomerSuggestions(this.value)" onfocus="renderQuickCustomerSuggestions(this.value)"><input id="qnCustomer" type="hidden"><div id="qnSuggestions" class="suggestions"></div></div></label><label>Notiz<textarea id="qnText" placeholder="Kurze Information zum Kunden festhalten …"></textarea></label><button class="btn primary" onclick="saveQuickNote()">Notiz speichern</button></div></div></div></div></div>`}
function renderQuickCustomerSuggestions(value){let box=$('#qnSuggestions'),hidden=$('#qnCustomer');if(!box||!hidden)return;hidden.value='';let q=String(value||'').trim().toLowerCase();if(!q){box.innerHTML='';box.classList.remove('show');return}let matches=[...S.customers].filter(c=>String(c.companyName||'').toLowerCase().startsWith(q)).sort((a,b)=>a.companyName.localeCompare(b.companyName,'de')).slice(0,8);box.innerHTML=matches.length?matches.map(c=>'<div class="suggestion" onclick="selectQuickCustomer(\''+c.id+'\')"><b>'+esc(c.companyName)+'</b>'+(c.inactive?'<div class="sub">Inaktiv</div>':'')+'</div>').join(''):'<div class="suggestion sub">Kein passender Kunde gefunden</div>';box.classList.add('show')}
function selectQuickCustomer(id){let c=S.customers.find(x=>x.id===id);if(!c)return;$('#qnCustomer').value=c.id;$('#qnCustomerInput').value=c.companyName;let box=$('#qnSuggestions');if(box){box.innerHTML='';box.classList.remove('show')}}
async function saveQuickNote(){let cid=$('#qnCustomer')?.value,text=$('#qnText')?.value.trim(),typed=$('#qnCustomerInput')?.value.trim();if(!cid&&typed){let exact=S.customers.find(c=>String(c.companyName||'').toLowerCase()===typed.toLowerCase());if(exact)cid=exact.id}if(!cid)return alert('Bitte einen Kunden aus den Vorschlägen auswählen.');if(!text)return alert('Bitte eine Notiz eingeben.');S.activities.push({id:uid(),customerId:cid,type:'note',at:new Date().toISOString(),text});await save();render();alert('Notiz wurde in der Kundenhistorie gespeichert.')}
function todoRow(t){let c=S.customers.find(x=>x.id===t.customerId);let cls=t.due<today()?'red':t.due===today()?'today':'';return`<div class="row"><button class="btn" onclick="doneTodo('${t.id}')">✓</button><div><div class="title click" onclick="nav('contacts','${t.customerId}')">${esc(c?.companyName||'')}</div><div>${esc(t.title)}</div></div><span class="due ${cls}">${dmy(t.due)}</span></div>`}
function activityRow(a){let c=S.customers.find(x=>x.id===a.customerId);return`<div class="row click" onclick="nav('contacts','${a.customerId}')"><div class="ico">${icons[a.type]||'📝'}</div><div><div class="title">${esc(c?.companyName||'')}</div><div>${esc(a.text||labels[a.type])}</div><div class="sub">${dt(a.at)}</div></div><button class="btn" title="Historieneintrag bearbeiten" onclick="event.stopPropagation();editActivityModal('${a.id}')">Bearbeiten</button></div>`}
function renderContacts(q=''){let rows=(contactMode==='active'?activeCustomers():inactiveCustomers()).sort((a,b)=>contactSortValue(b).localeCompare(contactSortValue(a))),s=q||$('#q').value.trim().toLowerCase();if(s)rows=rows.filter(c=>JSON.stringify(c).toLowerCase().includes(s)||S.activities.some(a=>a.customerId===c.id&&a.text?.toLowerCase().includes(s)));$('#view').innerHTML=`<div class="head"><div><h1>Kontakte</h1><p>Schneller Zugriff auf Unternehmen und Ansprechpartner.</p></div><button class="btn primary" onclick="customerModal()">＋ Unternehmen</button></div><div class="toolbar"><div class="tabs"><button class="tab ${contactMode==='active'?'on':''}" onclick="setContactMode('active')">Aktiv (${activeCustomers().length})</button><button class="tab ${contactMode==='inactive'?'on':''}" onclick="setContactMode('inactive')">Inaktiv (${inactiveCustomers().length})</button></div><input id="cq" value="${esc(s)}" placeholder="Kontakte durchsuchen …" oninput="renderContacts(this.value.toLowerCase())"></div><div class="table"><table><thead><tr><th>Unternehmen</th><th>Ansprechpartner</th><th>Letzter Kontakt</th><th>Nächstes Doing</th><th>Website</th><th>Quelle</th></tr></thead><tbody>${rows.map(c=>{let l=lastContact(c),n=nextTodo(c);return`<tr class="click" onclick="nav('contacts','${c.id}')"><td><b>${esc(c.companyName)}</b><div class="sub">${esc(c.industry||'')}</div></td><td>${esc(c.contactPerson||'')}<div class="sub">${c.email?'<a class="mail" href="mailto:'+esc(c.email)+'" onclick="event.stopPropagation()">'+esc(c.email)+'</a>':'–'}</div></td><td>${l?icons[l.type]+' '+dmy(l.at):dmy(c.lastContact)}</td><td>${n?esc(n.title)+' · '+dmy(n.due):'–'}</td><td>${c.website?'<a class="web" href="'+esc(siteUrl(c.website))+'" target="_blank" rel="noopener" onclick="event.stopPropagation()">'+esc(c.website)+'</a>':'–'}</td><td>${esc(c.source||'')}</td></tr>`}).join('')}</tbody></table></div>`}
function customer(id){let c=S.customers.find(x=>x.id===id);if(!c)return nav('contacts');let acts=S.activities.filter(a=>a.customerId===id).sort((a,b)=>String(b.at).localeCompare(String(a.at))),todos=S.todos.filter(t=>t.customerId===id&&!t.done).sort((a,b)=>(a.due||'9999').localeCompare(b.due||'9999')),l=lastContact(c);
$('#view').innerHTML=`<div class="customerHero"><div class="head"><div><h1>${esc(c.companyName)}</h1><div class="meta"><span>👤 ${esc(c.contactPerson||'–')}</span><span>✉️ ${c.email?'<a class="mail" href="mailto:'+esc(c.email)+'">'+esc(c.email)+'</a>':'–'}</span><span>📞 ${esc(c.phone||c.mobilePhone||'–')}</span><span>🌐 ${c.website?'<a class="web" href="'+esc(siteUrl(c.website))+'" target="_blank" rel="noopener">'+esc(c.website)+'</a>':'–'}</span><span>🏷 ${esc(c.source||'–')}</span><span>🧾 Warenwirtschaft: ${esc(c.erpSystem||'–')}</span><span class="pill">${c.sjSeen?'✓ SJ gesehen':'SJ noch nicht gesehen'}</span><span class="pill">${c.inactive?'Inaktiv':'Aktiv'}</span></div></div><div><button class="btn" onclick="customerModal('${c.id}')">Bearbeiten</button> <button class="btn primary" onclick="activityModal('${c.id}')">＋ Aktivität</button></div></div></div>
<div class="tiles"><div class="tile"><b style="font-size:18px">${l?dmy(l.at):dmy(c.lastContact)}</b><span>${l?labels[l.type]:'Letzter Kontakt'}</span></div><div class="tile"><b style="font-size:18px">${todos[0]?dmy(todos[0].due):'–'}</b><span>Nächstes Doing</span></div><div class="tile"><b>${1+(c.additionalContacts?.length||0)}</b><span>Ansprechpartner</span></div><div class="tile green"><b style="font-size:18px">${c.sjSeen?'Ja':'Nein'}</b><span>STOROJET gesehen</span></div></div>
<div class="grid"><div class="card"><h2>Historie</h2><div class="body timeline">${acts.map(a=>`<div class="event"><div class="ico">${icons[a.type]||'📝'}</div><div style="display:flex;justify-content:space-between;gap:10px;align-items:start"><b>${labels[a.type]||'Aktivität'} · ${dt(a.at)}</b><button class="btn" style="padding:5px 8px" onclick="editActivityModal('${a.id}')">Bearbeiten</button></div><div style="white-space:pre-wrap;margin-top:4px">${esc(a.text||'')}</div></div>`).join('')||'<div class="empty">Noch keine Historie.</div>'}</div></div><div class="card"><h2>Offene Doings</h2><div class="body">${todos.map(todoRow).join('')||'<div class="empty">Keine offenen Doings.</div>'}<button class="btn primary" onclick="todoModal('${c.id}')">＋ Doing</button></div></div></div>`}
function todos(){let rows=relevantTodos().sort((a,b)=>(a.due||'9999').localeCompare(b.due||'9999'));$('#view').innerHTML=`<div class="head"><div><h1>Doings</h1><p>Es werden nur überfällige, heute fällige und innerhalb der nächsten zwei Tage fällige Aufgaben angezeigt.</p></div><button class="btn primary" onclick="todoModal()">＋ Doing</button></div><div class="card"><div class="body">${rows.map(todoRow).join('')||'<div class="empty">Keine offenen Doings.</div>'}</div></div>`}

function setProjectMode(m){projectMode=m;projects()}
function projectTimeline(p){let phase=Number.isInteger(Number(p.phase))?Number(p.phase):-1,finished=p.status==='completed';return '<div class="projectTimeline">'+projectPhases.map((name,i)=>{let cls=finished?'done':i<phase?'past':i===phase?'current':'';return '<div class="phaseStep '+cls+'"><span class="phaseDot"></span>'+esc(name)+'</div>'}).join('')+'</div>'}
function projectPhaseBadge(p){let phase=Number(p.phase),name=projectPhases[phase]||'Phase festlegen';if(p.status==='completed')return '<span class="phaseBadge done">✓ Abgeschlossen</span>';return '<span class="phaseBadge '+(projectPhases[phase]?'':'unknown')+'">'+esc(name)+'</span>'}
function projects(){let rows=S.projects.filter(p=>(p.status||'active')===projectMode).sort((a,b)=>(a.targetDate||'9999').localeCompare(b.targetDate||'9999')||String(a.title||'').localeCompare(String(b.title||''),'de'));let activeCount=S.projects.filter(p=>(p.status||'active')==='active').length,doneCount=S.projects.filter(p=>p.status==='completed').length;$('#view').innerHTML=`<div class="head"><div><h1>Projekte</h1><p>Aktuelle STOROJET-Projekte und ihr Fortschritt.</p></div><button class="btn primary" onclick="projectModal()">＋ Projekt</button></div><div class="toolbar"><div class="tabs"><button class="tab ${projectMode==='active'?'on':''}" onclick="setProjectMode('active')">Laufend (${activeCount})</button><button class="tab ${projectMode==='completed'?'on':''}" onclick="setProjectMode('completed')">Abgeschlossen (${doneCount})</button></div></div><div class="projectList">${rows.map(p=>{let cust=S.customers.find(c=>c.id===p.customerId);return `<div class="projectCard"><div class="projectTop"><div><h3>${esc(p.title||'STOROJET Projekt')}</h3><div class="meta"><span class="click" onclick="nav('contacts','${p.customerId}')">🏢 ${esc(cust?.companyName||'Kein Kunde')}</span>${p.projectManager?'<span>👤 Projektleitung: '+esc(p.projectManager)+'</span>':''}${p.targetDate?'<span>📅 Ziel: '+dmy(p.targetDate)+'</span>':''}</div></div><div style="display:flex;gap:8px;align-items:center">${projectPhaseBadge(p)}<button class="btn" onclick="projectModal('${p.id}')">Bearbeiten</button></div></div>${projectTimeline(p)}${p.notes?'<div class="notice" style="margin:12px 0 0">'+esc(p.notes)+'</div>':''}</div>`}).join('')||'<div class="card"><div class="empty">'+(projectMode==='active'?'Keine laufenden Projekte.':'Keine abgeschlossenen Projekte.')+'</div></div>'}</div>`}
function projectModal(id){let p=S.projects.find(x=>x.id===id)||{phase:0,status:'active'},customers=[...S.customers].sort((a,b)=>a.companyName.localeCompare(b.companyName,'de'));let customerOpts=customers.map(c=>`<option value="${c.id}" ${c.id===p.customerId?'selected':''}>${esc(c.companyName)}${c.inactive?' (inaktiv)':''}</option>`).join(''),phaseOpts=projectPhases.map((x,i)=>`<option value="${i}" ${Number(p.phase)===i?'selected':''}>${i+1}. ${esc(x)}</option>`).join('');openDlg(id?'Projekt bearbeiten':'Projekt anlegen',`<div class="form"><label>Projektname<input id="pTitle" value="${esc(p.title||'')}" placeholder="z. B. STOROJET Meier Medizintechnik"></label><label>Kunde<select id="pCustomer"><option value="">Kunde auswählen …</option>${customerOpts}</select></label><div class="cols"><label>Aktuelle Phase<select id="pPhase">${phaseOpts}</select></label><label>Status<select id="pStatus"><option value="active" ${p.status!=='completed'?'selected':''}>Laufend</option><option value="completed" ${p.status==='completed'?'selected':''}>Abgeschlossen</option></select></label></div><div class="cols"><label>Projektleitung<input id="pManager" value="${esc(p.projectManager||'')}"></label><label>Account Manager<input id="pAccount" value="${esc(p.accountManager||'')}"></label></div><div class="cols"><label>Ansprechpartner Kunde<input id="pClient" value="${esc(p.client||'')}"></label><label>Zieltermin<input id="pTarget" type="date" value="${esc(p.targetDate||'')}"></label></div><label>Notiz / Besonderheiten<textarea id="pNotes">${esc(p.notes||'')}</textarea></label></div>`,`<button class="btn" onclick="dlg.close()">Abbrechen</button><button class="btn primary" onclick="saveProject('${id||''}')">Speichern</button>`)}
async function saveProject(id){let customerId=$('#pCustomer')?.value,title=$('#pTitle')?.value.trim();if(!customerId)return alert('Bitte einen Kunden auswählen.');if(!title)return alert('Bitte einen Projektnamen eingeben.');let p=id?S.projects.find(x=>x.id===id):{id:uid()};Object.assign(p,{customerId,title,phase:Number($('#pPhase').value),status:$('#pStatus').value,projectManager:$('#pManager').value.trim(),accountManager:$('#pAccount').value.trim(),client:$('#pClient').value.trim(),targetDate:$('#pTarget').value,notes:$('#pNotes').value.trim(),updatedAt:new Date().toISOString()});if(p.status==='completed')p.phase=projectPhases.length-1;if(!id)S.projects.push(p);await save();dlg.close();projectMode=p.status==='completed'?'completed':'active';projects();notify('Projekt gespeichert.')}
function history(){let rows=[...S.activities].sort((a,b)=>String(b.at).localeCompare(String(a.at)));$('#view').innerHTML=`<div class="head"><div><h1>Historie</h1><p>Telefonate, E-Mails, Teams-Meetings, Vor-Ort-Termine und Notizen.</p></div></div><div class="card"><div class="body">${rows.map(activityRow).join('')||'<div class="empty">Noch keine Aktivitäten.</div>'}</div></div>`}
function settings(){$('#view').innerHTML=`<div class="head"><div><h1>Einstellungen & Datensicherung</h1><p>Logo, Quellen, Import, Export und lokale Browserdaten.</p></div></div>
<div class="grid" style="margin-bottom:18px">
<div class="card"><h2>🖼 Logo & Erscheinungsbild</h2><div class="body">
${S.settings.logoDataUrl?'<div style="background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px;text-align:center"><img src="'+S.settings.logoDataUrl+'" alt="Logo" style="max-width:240px;max-height:100px;object-fit:contain"></div>':'<p class="sub">Noch kein eigenes Logo hinterlegt.</p>'}
<p><input type="file" id="logoFile" accept="image/png,image/jpeg,image/webp,image/svg+xml"></p>
<button class="btn primary" onclick="uploadLogo()">Logo hochladen</button>
${S.settings.logoDataUrl?' <button class="btn danger" onclick="removeLogo()">Logo entfernen</button>':''}
<p class="sub" style="margin-top:10px">Das Logo wird lokal im CRM gespeichert und in deinem JSON-Backup mitgesichert.</p>
</div></div>
<div class="card"><h2>🏷 Kontaktquellen</h2><div class="body">
<div style="display:flex;gap:8px;margin-bottom:12px"><input id="newSource" placeholder="Neue Quelle, z. B. Messe" style="flex:1;padding:10px 11px;border:1px solid var(--line);border-radius:9px"><button class="btn primary" onclick="addSource()">Hinzufügen</button></div>
<div style="display:flex;flex-wrap:wrap;gap:8px">${S.settings.sources.map(s=>'<span class="pill" style="display:inline-flex;align-items:center;gap:7px">'+esc(s)+' <button title="Quelle entfernen" onclick="removeSource(\''+esc(s).replace(/'/g,"\\'")+'\')" style="border:0;background:transparent;color:inherit;cursor:pointer;font-weight:700">×</button></span>').join('')}</div>
<p class="sub" style="margin-top:12px">Neue Quellen stehen sofort bei allen Kunden zur Auswahl.</p>
</div></div></div>
<div class="grid"><div class="card"><h2>Datenaustausch</h2><div class="body"><p>Deine Kundendaten werden nicht im GitHub-Repository gespeichert.</p><p><input type="file" id="imp" accept=".json"></p><button class="btn primary" onclick="importJson()">JSON importieren</button> <button class="btn" onclick="exportJson()">JSON exportieren</button></div></div><div class="card"><h2>Lokale Sicherung</h2><div class="body"><p>Kontakte: <b>${S.customers.length}</b><br>Historie: <b>${S.activities.length}</b><br>Doings: <b>${S.todos.length}</b></p><button class="btn" onclick="makeBackup()">Sicherungsstand erstellen</button> <button class="btn danger" onclick="clearAll()">Browserdaten löschen</button></div></div></div>`}
async function uploadLogo(){let f=$('#logoFile')?.files?.[0];if(!f)return alert('Bitte zuerst eine Bilddatei auswählen.');if(f.size>3000000)return alert('Das Logo ist zu groß. Bitte eine Datei unter 3 MB verwenden.');let data=await new Promise((ok,no)=>{let r=new FileReader();r.onload=()=>ok(r.result);r.onerror=()=>no(r.error);r.readAsDataURL(f)});S.settings.logoDataUrl=data;await save();applyBrand();settings()}
async function removeLogo(){if(!confirm('Logo wirklich entfernen?'))return;S.settings.logoDataUrl='';await save();applyBrand();settings()}
async function addSource(){let el=$('#newSource'),v=el?.value.trim();if(!v)return;if(S.settings.sources.some(s=>s.toLowerCase()===v.toLowerCase()))return alert('Diese Quelle ist bereits vorhanden.');S.settings.sources.push(v);S.settings.sources.sort((a,b)=>a.localeCompare(b,'de'));await save();settings()}
async function removeSource(v){if(!S.settings.sources.includes(v))return;let used=S.customers.filter(c=>c.source===v).length;if(used&&!confirm('Die Quelle „'+v+'“ ist bei '+used+' Kunden hinterlegt. Sie wird nur aus der Auswahlliste entfernt; bestehende Kundenzuordnungen bleiben erhalten. Fortfahren?'))return;S.settings.sources=S.settings.sources.filter(s=>s!==v);await save();settings()}
function openDlg(title,body,foot){$('#dlgTitle').textContent=title;$('#dlgBody').innerHTML=body;$('#dlgFoot').innerHTML=foot;dlg.showModal()}
function customerModal(id){let c=S.customers.find(x=>x.id===id)||{};openDlg(id?'Unternehmen bearbeiten':'Unternehmen anlegen',`<div class="form"><div class="cols"><label>Firmenname<input id="fCompany" value="${esc(c.companyName||'')}"></label><label>Ansprechpartner<input id="fContact" value="${esc(c.contactPerson||'')}"></label></div><div class="cols"><label>E-Mail<input id="fEmail" value="${esc(c.email||'')}"></label><label>Telefon<input id="fPhone" value="${esc(c.phone||'')}"></label></div><div class="cols"><label>Website<input id="fWebsite" value="${esc(c.website||'')}" placeholder="www.beispiel.de"></label><label>Status<select id="fInactive"><option value="false" ${!c.inactive?'selected':''}>Aktiv</option><option value="true" ${c.inactive?'selected':''}>Inaktiv</option></select></label></div><div class="cols"><label>Branche<input id="fIndustry" value="${esc(c.industry||'')}"></label><label>Quelle<select id="fSource">${Array.from(new Set([...(S.settings.sources||[]),...(c.source?[c.source]:[])])).map(x=>`<option ${x===c.source?'selected':''}>${esc(x)}</option>`).join('')}</select></label></div><div class="cols"><label>Warenwirtschaft / ERP-System<input id="fErpSystem" value="${esc(c.erpSystem||'')}" placeholder="z. B. SAP, JTL, Microsoft Dynamics"></label><label style="align-content:end"><span style="display:flex;align-items:center;gap:9px;padding:10px 0"><input id="fSjSeen" type="checkbox" ${c.sjSeen?'checked':''} style="width:auto"> SJ gesehen</span></label></div><label>Adresse<textarea id="fAddress">${esc(c.address||'')}</textarea></label></div>`,`<button class="btn" onclick="dlg.close()">Abbrechen</button><button class="btn primary" onclick="saveCustomer('${id||''}')">Speichern</button>`)}
async function saveCustomer(id){let c=id?S.customers.find(x=>x.id===id):{id:uid(),firstContact:today(),additionalContacts:[]};Object.assign(c,{companyName:$('#fCompany').value.trim(),contactPerson:$('#fContact').value.trim(),email:$('#fEmail').value.trim(),phone:$('#fPhone').value.trim(),website:$('#fWebsite').value.trim(),inactive:$('#fInactive').value==='true',industry:$('#fIndustry').value.trim(),source:$('#fSource').value,erpSystem:$('#fErpSystem').value.trim(),sjSeen:$('#fSjSeen').checked,address:$('#fAddress').value.trim()});if(!id)S.customers.push(c);await save();dlg.close();nav('contacts',c.id)}
function activityModal(cid){let opts=S.customers.map(c=>`<option value="${c.id}" ${c.id===cid?'selected':''}>${esc(c.companyName)}</option>`).join('');openDlg('Aktivität erfassen',`<div class="form"><label>Unternehmen<select id="aCust">${opts}</select></label><div class="cols"><label>Art<select id="aType"><option value="phone">📞 Telefonat</option><option value="email_sent">✉️ E-Mail gesendet</option><option value="email_received">📥 E-Mail erhalten</option><option value="teams">💻 Teams-Meeting</option><option value="onsite">🤝 Vor-Ort-Termin</option><option value="note">📝 Notiz</option></select></label><label>Datum / Uhrzeit<input id="aDate" type="datetime-local" value="${localDateTimeValue()}"></label></div><label>Notiz<textarea id="aText"></textarea></label><label><input id="aTodo" type="checkbox"> Wiedervorlage direkt anlegen</label><div class="cols"><label>Doing<input id="aTodoTitle" placeholder="z.B. Nachfassen"></label><label>Fällig<input id="aDue" type="date"></label></div></div>`,`<button class="btn" onclick="dlg.close()">Abbrechen</button><button class="btn primary" onclick="saveActivity()">Speichern</button>`)}
function editActivityModal(id){let a=S.activities.find(x=>x.id===id);if(!a)return;let c=S.customers.find(x=>x.id===a.customerId);openDlg('Historieneintrag bearbeiten',`<div class="form"><label>Kunde<input value="${esc(c?.companyName||'')}" disabled></label><div class="cols"><label>Art<select id="eType"><option value="phone" ${a.type==='phone'?'selected':''}>📞 Telefonat</option><option value="email_sent" ${a.type==='email_sent'?'selected':''}>✉️ E-Mail gesendet</option><option value="email_received" ${a.type==='email_received'?'selected':''}>📥 E-Mail erhalten</option><option value="teams" ${a.type==='teams'?'selected':''}>💻 Teams-Meeting</option><option value="onsite" ${a.type==='onsite'?'selected':''}>🤝 Vor-Ort-Termin</option><option value="note" ${a.type==='note'?'selected':''}>📝 Notiz</option><option value="document" ${a.type==='document'?'selected':''}>📄 Dokument</option><option value="todo_done" ${a.type==='todo_done'?'selected':''}>☑️ Doing erledigt</option></select></label><label>Datum / Uhrzeit<input id="eDate" type="datetime-local" value="${localDateTimeValue(a.at)}"></label></div><label>Text<textarea id="eText">${esc(a.text||'')}</textarea></label></div>`,`<button class="btn" onclick="dlg.close()">Abbrechen</button><button class="btn primary" onclick="saveActivityEdit('${id}')">Änderungen speichern</button>`)}
async function saveActivityEdit(id){let a=S.activities.find(x=>x.id===id);if(!a)return;let val=$('#eDate').value;if(!val)return alert('Bitte Datum und Uhrzeit angeben.');a.type=$('#eType').value;a.at=new Date(val).toISOString();a.text=$('#eText').value.trim();await save();dlg.close();render()}
async function saveActivity(){let cid=$('#aCust').value,a={id:uid(),customerId:cid,type:$('#aType').value,at:new Date($('#aDate').value).toISOString(),text:$('#aText').value.trim()};S.activities.push(a);if($('#aTodo').checked&&$('#aTodoTitle').value.trim())S.todos.push({id:uid(),customerId:cid,title:$('#aTodoTitle').value.trim(),due:$('#aDue').value,done:false});await save();dlg.close();nav('contacts',cid)}
function todoModal(cid){let customers=activeCustomers().sort((a,b)=>a.companyName.localeCompare(b.companyName,'de'));if(!customers.length)return alert('Es gibt aktuell keine aktiven Kunden für ein Doing.');let validCid=customers.some(c=>c.id===cid)?cid:'';let opts=customers.map(c=>`<option value="${c.id}" ${c.id===validCid?'selected':''}>${esc(c.companyName)}</option>`).join('');openDlg('Doing anlegen',`<div class="form"><label>Unternehmen<select id="tCust">${opts}</select></label><label>Aufgabe<input id="tTitle" placeholder="Was ist zu erledigen?" autofocus></label><label>Fällig<input id="tDue" type="date" value="${today()}"></label><div class="sub">Doings werden im Dashboard und in der Doing-Liste erst angezeigt, wenn sie überfällig, heute oder innerhalb der nächsten zwei Tage fällig sind.</div></div>`,`<button class="btn" onclick="dlg.close()">Abbrechen</button><button class="btn primary" onclick="saveTodo()">Speichern</button>`)}
async function saveTodo(){let cid=$('#tCust')?.value,title=$('#tTitle')?.value.trim(),due=$('#tDue')?.value,c=S.customers.find(x=>x.id===cid);if(!c||c.inactive)return alert('Doings können nur für aktive Kunden angelegt werden.');if(!title)return alert('Bitte eine Aufgabe eingeben.');if(!due)return alert('Bitte ein Fälligkeitsdatum auswählen.');let item={id:uid(),customerId:cid,title,due,done:false,createdAt:new Date().toISOString()};S.todos.push(item);await save();dlg.close();render();if(due>dueLimit()){let visible=new Date(due+'T12:00:00');visible.setDate(visible.getDate()-2);notify('Doing gespeichert. Es wird ab '+visible.toLocaleDateString('de-DE')+' in der Doing-Ansicht angezeigt.')}else notify('Doing gespeichert.')}
async function doneTodo(id){let t=S.todos.find(x=>x.id===id);if(!t)return;t.done=true;t.doneAt=new Date().toISOString();S.activities.push({id:uid(),customerId:t.customerId,type:'todo_done',at:t.doneAt,text:'Aufgabe erledigt: '+t.title});await save();render()}
async function importJson(){let f=$('#imp').files[0];if(!f)return alert('Bitte JSON-Datei auswählen.');let x=JSON.parse(await f.text());S.customers=x.customers||[];S.todos=x.todos||[];S.activities=x.activities||[];S.settings={...S.settings,...(x.settings||{})};S.projects=x.projects||[];syncLegacy();syncLegacyProjects();await save();alert('Import abgeschlossen: '+S.customers.length+' Kontakte.');render()}
function exportJson(){let blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='STOROJET_CRM_Backup_'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
async function makeBackup(){S.backups.push({at:new Date().toISOString(),data:JSON.parse(JSON.stringify({customers:S.customers,todos:S.todos,activities:S.activities,projects:S.projects,settings:S.settings}))});S.backups=S.backups.slice(-10);await save();alert('Lokaler Sicherungsstand erstellt.')}
async function clearAll(){if(!confirm('Wirklich alle lokalen CRM-Daten in diesem Browser löschen?'))return;S={customers:[],todos:[],activities:[],projects:[],settings:{sources:['Google','Website','LogiMAT','Empfehlung','Sonstiges'],stale:90},backups:[]};await save();render()}
load().then(async()=>{syncLegacy();syncLegacyProjects();await save();render()});
</script>

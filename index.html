<script>

function siteUrl(v){if(!v)return'';return /^https?:\/\//i.test(v)?v:'https://'+v}
function localDateTimeValue(v){let d=v?new Date(String(v).length===10?v+'T12:00:00':v):new Date();if(Number.isNaN(d.getTime()))d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,16)}
function lastContact(c){let a=S.activities.filter(x=>x.customerId===c.id&&['phone','email_sent','email_received','offer_sent','teams','onsite'].includes(x.type)).sort((a,b)=>String(b.at).localeCompare(String(a.at)))[0];return a||null}
function nextTodo(c){return S.todos.filter(t=>t.customerId===c.id&&!t.done).sort((a,b)=>(a.due||'9999').localeCompare(b.due||'9999'))[0]||null}
function contactReference(c){let a=lastContact(c),raw=a?.at||c.lastContact||c.firstContact||'';if(!raw)return null;let d=new Date(String(raw).length===10?raw+'T12:00:00':raw);return Number.isNaN(d.getTime())?null:{at:d.toISOString(),activity:a}}
function daysSince(v){if(!v)return null;let d=new Date(v),n=new Date();if(Number.isNaN(d.getTime()))return null;return Math.max(0,Math.floor((n-d)/86400000))}
function followupGreeting(c){let s=String(c.salutation||'').trim(),name=String(c.contactPerson||'').trim();if(s&&name)return 'Guten Tag '+s+' '+name+',';return 'Guten Tag,'}
function followupContacts(c,limit=3){return S.activities.filter(a=>a.customerId===c.id&&['phone','email_sent','email_received','offer_sent','teams','onsite'].includes(a.type)).sort((a,b)=>String(b.at).localeCompare(String(a.at))).slice(0,limit)}
function followupCleanText(v){let s=String(v||'').replace(/\s+/g,' ').trim();s=s.replace(/^(guten tag|hallo|sehr geehrte[^,]*),?\s*/i,'');s=s.replace(/(viele grüße|mit freundlichen grüßen).*$/i,'').trim();return s.slice(0,450)}
function followupContext(c){let contacts=followupContacts(c,3),latest=contacts[0]||null,text=followupCleanText(latest?.text||''),low=text.toLowerCase(),kind='general';
if(/angebot|preisindikation|preis|kalkulation|budget/.test(low))kind='offer';
else if(/intern|entscheidung|abstimm|freigabe|geschäftsleitung|gf\b/.test(low))kind='decision';
else if(/verschob|später|nächstes jahr|zurückstell|pause|wieder aufnehmen/.test(low))kind='postponed';
else if(/termin|teams|meeting|besuch|vor ort|referenz/.test(low)||['teams','onsite'].includes(latest?.type))kind='meeting';
else if(/rückmeldung|feedback|prüfen|gelegenheit|unterlagen/.test(low))kind='feedback';

function followupSubject(c){let x=followupContext(c);if(x.kind==='offer')return 'Kurze Rückfrage zu unserem Angebot';if(x.kind==='decision')return 'Kurze Rückfrage zum aktuellen Stand';if(x.kind==='postponed')return 'Wie besprochen – kurze Rückfrage';if(x.kind==='meeting')return 'Kurze Rückfrage zu unserem letzten Austausch';if(x.kind==='feedback')return 'Kurze Rückfrage zu den Unterlagen';return 'Kurze Rückfrage zum Thema Lagerautomatisierung'}
function followupText(c){let x=followupContext(c),g=followupGreeting(c),date=x.latest?.at?dmy(x.latest.at):'',p='';
if(x.kind==='offer')p='ich wollte noch einmal kurz an unser'+(date?' Gespräch vom '+date:'en letzten Austausch')+' anknüpfen und nachhören, ob Sie inzwischen Gelegenheit hatten, das Angebot bzw. die Preisindikation zu prüfen. Gibt es hierzu bereits einen neuen Stand oder noch Punkte, die wir gemeinsam klären können?';
else if(x.kind==='decision')p='bei unserem letzten Austausch hatten Sie das Thema noch intern in Abstimmung. Daher wollte ich kurz nachhören, ob es hierzu inzwischen eine Entscheidung oder einen neuen Stand gibt.';
else if(x.kind==='postponed')p='bei unserem letzten Austausch hatten wir besprochen, das Thema zu einem späteren Zeitpunkt wieder aufzunehmen. Ich wollte daher kurz nachfragen, ob der Zeitpunkt inzwischen wieder passend ist und das Thema Lagerautomatisierung bei Ihnen erneut relevant wird.';
else if(x.kind==='meeting')p='vielen Dank noch einmal für unseren letzten Austausch'+(date?' am '+date:'')+'. Ich wollte daran anknüpfen und kurz nachhören, wie der aktuelle Stand bei Ihnen ist und ob wir die nächsten Schritte gemeinsam konkretisieren sollen.';
else if(x.kind==='feedback')p='ich wollte kurz an unseren letzten Austausch anknüpfen und nachhören, ob Sie die Unterlagen inzwischen prüfen konnten. Gibt es hierzu bereits eine Rückmeldung oder noch offene Punkte, bei denen ich unterstützen kann?';
else p='ich wollte noch einmal kurz an unseren letzten Austausch'+(date?' vom '+date:'')+' anknüpfen und nachhören, wie der aktuelle Stand zum Thema Lagerautomatisierung bei Ihnen ist.';
return g+'\n\n'+p+'\n\nÜber eine kurze Rückmeldung freue ich mich.\n\nViele Grüße\nJulian Trillken'}
function followupBasis(c){let contacts=followupContacts(c,3);return contacts.map(a=>({at:a.at,type:a.type,text:followupCleanText(a.text||labels[a.type]||'')}))}
function syncFollowupDrafts(){let threshold=Math.max(1,Number(S.settings.followupDays)||30),changed=false;for(const d of S.followupDrafts){if(d.status!=='open')continue;let c=S.customers.find(x=>x.id===d.customerId),ref=c?contactReference(c):null;if(!c||c.inactive||(ref&&d.baseContactAt&&ref.at!==d.baseContactAt)){d.status='superseded';d.closedAt=new Date().toISOString();changed=true;continue}if(c&&!d.manuallyEdited){let subject=followupSubject(c),body=followupText(c),basis=followupBasis(c);if(d.subject!==subject||d.body!==body||JSON.stringify(d.basis||[])!==JSON.stringify(basis)){d.subject=subject;d.body=body;d.basis=basis;d.autoUpdatedAt=new Date().toISOString();changed=true}}}for(const c of activeCustomers()){if(!c.email)continue;let ref=contactReference(c);if(!ref)continue;let age=daysSince(ref.at);if(age===null||age<threshold)continue;let already=S.followupDrafts.some(d=>d.customerId===c.id&&d.baseContactAt===ref.at);if(already)continue;S.followupDrafts.push({id:uid(),customerId:c.id,baseContactAt:ref.at,createdAt:new Date().toISOString(),status:'open',subject:followupSubject(c),body:followupText(c),basis:followupBasis(c),manuallyEdited:false});changed=true}return changed}
function openFollowupDrafts(){syncFollowupDrafts();nav('drafts')}
function draftsView(){syncFollowupDrafts();let rows=S.followupDrafts.filter(d=>d.status==='open'&&S.customers.some(c=>c.id===d.customerId&&!c.inactive)).sort((a,b)=>{let ca=S.customers.find(c=>c.id===a.customerId),cb=S.customers.find(c=>c.id===b.customerId);return (daysSince(b.baseContactAt)||0)-(daysSince(a.baseContactAt)||0)||String(ca?.companyName||'').localeCompare(String(cb?.companyName||''),'de')});$('#view').innerHTML=`<div class="head"><div><h1>Nachfass-Entwürfe</h1><p>Automatisch vorbereitete E-Mail-Entwürfe für ältere Kontakte. Es wird nichts automatisch versendet.</p></div><span class="pill">${rows.length} offen</span></div><div class="sectionCard"><div class="sectionHead"><div><h2>✉ Offene Entwürfe</h2><div class="sub">Nach ${Number(S.settings.followupDays)||30} Tagen ohne echten Kundenkontakt</div></div></div><div class="body">${rows.map(followupDraftCard).join('')||'<div class="empty">Aktuell sind keine Nachfass-Entwürfe offen.</div>'}</div></div>`}
function followupDraftCard(d){let c=S.customers.find(x=>x.id===d.customerId),age=daysSince(d.baseContactAt),basis=Array.isArray(d.basis)&&d.basis.length?d.basis:followupBasis(c||{});return `<div class="draftCard"><div class="draftTop"><div><b class="click" onclick="nav('contacts','${d.customerId}')">${esc(c?.companyName||'Unbekannter Kunde')}</b><div class="draftMeta"><span class="pill">${age===null?'–':age+' Tage ohne Kontakt'}</span><span class="sub">${esc(c?.email||'Keine E-Mail')}</span><span class="pill">${d.manuallyEdited?'manuell bearbeitet':'automatisch personalisiert'}</span></div></div><span class="sub">erstellt ${dmy(d.createdAt)}</span></div><div style="margin-top:12px"><b>${esc(d.subject||'')}</b></div><div class="draftBody">${esc(d.body||'')}</div><div style="margin:10px 0 12px"><div class="sub" style="font-weight:700;margin-bottom:6px">Grundlage der Formulierung</div>${basis.map(b=>'<div class="sub" style="margin:4px 0">• '+dmy(b.at)+' · '+esc(labels[b.type]||b.type||'Kontakt')+(b.text?' · '+esc(b.text.slice(0,180)):'')+'</div>').join('')||'<div class="sub">Keine Kontaktdetails verfügbar.</div>'}</div><div class="draftActions"><button class="btn" onclick="editFollowupDraft('${d.id}')">Bearbeiten</button><button class="btn" onclick="openDraftInOutlook('${d.id}')">Outlook öffnen</button><button class="btn primary" onclick="completeFollowupDraft('${d.id}')">Erledigt</button></div></div>`}
function editFollowupDraft(id){let d=S.followupDrafts.find(x=>x.id===id);if(!d)return;let c=S.customers.find(x=>x.id===d.customerId);openDlg('Nachfass-Entwurf bearbeiten',`<div class="form"><label>Kunde<input value="${esc(c?.companyName||'')}" disabled></label><label>E-Mail<input value="${esc(c?.email||'')}" disabled></label><label>Betreff<input id="fdSubject" value="${esc(d.subject||'')}"></label><label>Entwurf<textarea id="fdBody" style="min-height:260px">${esc(d.body||'')}</textarea></label></div>`,`<button class="btn" onclick="dlg.close()">Abbrechen</button><button class="btn primary" onclick="saveFollowupDraft('${id}')">Entwurf speichern</button>`)}

function deDateToIsoDate(v){let m=String(v||'').match(/^(\d{2})\.(\d{2})\.(\d{4})$/);return m?m[3]+'-'+m[2]+'-'+m[1]:''}
function deDateTimeToIso(date,time){let d=deDateToIsoDate(date);if(!d)return'';let [y,m,day]=d.split('-').map(Number),[hh,mm]=String(time||'00:00').split(':').map(Number);return new Date(y,m-1,day,hh||0,mm||0,0).toISOString()}

function secondsToHM(sec){sec=Math.max(0,Math.round(Number(sec)||0));let h=Math.floor(sec/3600),m=Math.floor((sec%3600)/60);return h+':'+String(m).padStart(2,'0')}
function currentMonthKey(){let d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}
function monthLabel(key){if(!/^\d{4}-\d{2}$/.test(key||''))return key||'';let [y,m]=key.split('-').map(Number);return new Date(y,m-1,1).toLocaleDateString('de-DE',{month:'long',year:'numeric'})}
function timeEntryMonth(e){let d=new Date(e?.start||'');if(Number.isNaN(d.getTime()))return'';return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}

function monthTimeStats(key){let report=latestTimeReportForMonth(key);if(!report)return{entries:[],seconds:0,days:0,report:null};let entries=Array.isArray(report.entries)?report.entries.filter(e=>e&&e.start):[],seconds=Number.isFinite(Number(report.reportedSeconds))?Number(report.reportedSeconds):entries.reduce((n,e)=>n+(Number(e.durationSeconds)||0),0),days=Number(report.workDayCount)||0;if(!days&&entries.length)days=new Set(entries.map(e=>String(e.start).slice(0,10))).size;if(!days&&report.periodStart&&report.periodEnd){let legacy=(Array.isArray(S.timeEntries)?S.timeEntries:[]).filter(e=>e?.start&&String(e.start).slice(0,10)>=report.periodStart&&String(e.start).slice(0,10)<=report.periodEnd);days=new Set(legacy.map(e=>String(e.start).slice(0,10))).size}return{entries,seconds,days,report}}
function latestTimeReport(){let reports=Array.isArray(S.timeReports)?S.timeReports:[];return [...reports].filter(Boolean).sort((a,b)=>String(b.importedAt||'').localeCompare(String(a.importedAt||''))||String(b.periodEnd||'').localeCompare(String(a.periodEnd||'')))[0]||null}
function vacationBalance(){let r=latestTimeReport();return Number.isFinite(Number(r?.vacationBalance))?Number(r.vacationBalance):null}
function timeChartHtml(key){let st=monthTimeStats(key),entries=st.entries;if(!entries.length)return '<div class="empty" style="padding:28px 8px">Tagesdetails stehen ab dem nächsten Import dieser Auswertung zur Verfügung.</div>';let [y,m]=key.split('-').map(Number),daysInMonth=new Date(y,m,0).getDate(),daily={};entries.forEach(e=>{let d=new Date(e.start),day=d.getDate();daily[day]=(daily[day]||0)+(Number(e.durationSeconds)||0)});let max=Math.max(1,...Object.values(daily));let bars=[],labels=[];for(let day=1;day<=daysInMonth;day++){let sec=daily[day]||0,height=sec?Math.max(4,Math.round(sec/max*100)):2;bars.push('<div class="workBar" style="height:'+height+'%" data-tip="'+String(day).padStart(2,'0')+'. · '+secondsToHM(sec)+' h"></div>');labels.push('<span>'+([1,5,10,15,20,25,daysInMonth].includes(day)?day:'')+'</span>')}return '<div class="barArea">'+bars.join('')+'</div><div class="barLabels">'+labels.join('')+'</div>'}
function timeOverviewHtml(key){let st=monthTimeStats(key),vac=vacationBalance(),latest=latestTimeReport(),avg=st.days?Math.round(st.seconds/st.days):0;return '<div class="timeOverview"><div class="timeMetric"><div class="label">⏱ Ø Arbeitszeit pro Tag · '+esc(monthLabel(key))+'</div><div class="big">'+secondsToHM(avg)+' h</div><div class="label">'+(st.report?'Aus letzter Auswertung: '+secondsToHM(st.seconds)+' h / '+st.days+' Arbeitstag'+(st.days===1?'':'e'):'Noch keine Auswertung importiert')+'</div></div><div class="timeMetric"><div class="label">🏖 Resturlaub</div><div class="big">'+(vac===null?'–':vac.toLocaleString('de-DE',{minimumFractionDigits:vac%1?2:0,maximumFractionDigits:2})+' Tage')+'</div><div class="label">'+(latest?.periodEnd?'Stand '+dmy(latest.periodEnd):'Noch keine Auswertung importiert')+'</div></div><div class="timeChart"><div style="display:flex;justify-content:space-between;gap:10px"><b>Arbeitszeit pro Tag</b><span class="sub">'+esc(monthLabel(key))+'</span></div>'+timeChartHtml(key)+'</div></div>'}
function parseTimeReport(text){text=String(text||'').replace(/\r/g,'');let name=(text.match(/Arbeitszeiten für\s+([^\n]+)/i)||[])[1]?.trim()||'',workDayMatch=text.match(/(\d+)\s+Tage?\s+mit\s+Arbeitszeit-\(Start-\)Buchungen/i),workDayCount=workDayMatch?Number(workDayMatch[1]):0,range=text.match(/(\d{2}\.\d{2}\.\d{4})\s*-\s*(\d{2}\.\d{2}\.\d{4})/),periodStart=range?deDateToIsoDate(range[1]):'',periodEnd=range?deDateToIsoDate(range[2]):'',entries=[],re=/(?:Mo|Di|Mi|Do|Fr|Sa|So)\s+(\d{2}\.\d{2}\.\d{4})\s+(\d{2}:\d{2})\s*-\s*(?:Mo|Di|Mi|Do|Fr|Sa|So)\s+(\d{2}\.\d{2}\.\d{4})\s+(\d{2}:\d{2})\s+(\d+):(\d{2}):(\d{2})/g,m;while((m=re.exec(text))){let start=deDateTimeToIso(m[1],m[2]),end=deDateTimeToIso(m[3],m[4]),seconds=durationSeconds(m[5],m[6],m[7]);entries.push({start,end,durationSeconds:seconds,key:start+'|'+end+'|'+seconds})}let total=text.match(/Arbeitszeit\s*%\s*Pausen:\s*(\d+):(\d{2}):(\d{2})/i),reportedSeconds=total?durationSeconds(total[1],total[2],total[3]):entries.reduce((n,e)=>n+e.durationSeconds,0),vac=text.match(/Aktueller Urlaubssaldo:\s*([\d.,]+)\s*Tage/i),vacationBalanceValue=vac?Number(vac[1].replace('.','').replace(',','.')):null;return{name,workDayCount,periodStart,periodEnd,entries,reportedSeconds,vacationBalance:vacationBalanceValue}}

function projects(){let rows=S.projects.filter(p=>(p.status||'active')===projectMode).sort((a,b)=>(a.targetDate||'9999').localeCompare(b.targetDate||'9999')||String(a.title||'').localeCompare(String(b.title||''),'de'));let activeCount=S.projects.filter(p=>(p.status||'active')==='active').length,doneCount=S.projects.filter(p=>p.status==='completed').length;$('#view').innerHTML=`<div class="head"><div><h1>Projekte</h1><p>Aktuelle STOROJET-Projekte und ihr Fortschritt.</p></div><button class="btn primary" onclick="projectModal()">＋ Projekt</button></div><div class="toolbar"><div class="tabs"><button class="tab ${projectMode==='active'?'on':''}" onclick="setProjectMode('active')">Laufend (${activeCount})</button><button class="tab ${projectMode==='completed'?'on':''}" onclick="setProjectMode('completed')">Abgeschlossen (${doneCount})</button></div></div><div class="projectList">${rows.map(p=>{let cust=S.customers.find(c=>c.id===p.customerId);return `<div class="projectCard"><div class="projectTop"><div><h3>${esc(p.title||'STOROJET Projekt')}</h3><div class="meta"><span class="click" onclick="nav('contacts','${p.customerId}')">🏢 ${esc(cust?.companyName||'Kein Kunde')}</span>${p.projectManager?'<span>👤 Projektleitung: '+esc(p.projectManager)+'</span>':''}${p.targetDate?'<span>📅 Ziel: '+dmy(p.targetDate)+'</span>':''}</div></div><div style="display:flex;gap:8px;align-items:center">${projectPhaseBadge(p)}<button class="btn" onclick="projectModal('${p.id}')">Bearbeiten</button></div></div>${projectTimeline(p)}${p.notes?'<div class="notice" style="margin:12px 0 0">'+esc(p.notes)+'</div>':''}</div>`}).join('')||'<div class="card"><div class="empty">'+(projectMode==='active'?'Keine laufenden Projekte.':'Keine abgeschlossenen Projekte.')+'</div></div>'}</div>`}
function projectModal(id){let p=S.projects.find(x=>x.id===id)||{phase:0,status:'active'},customers=[...S.customers].sort((a,b)=>a.companyName.localeCompare(b.companyName,'de'));let customerOpts=customers.map(c=>`<option value="${c.id}" ${c.id===p.customerId?'selected':''}>${esc(c.companyName)}${c.inactive?' (inaktiv)':''}</option>`).join(''),phaseOpts=projectPhases.map((x,i)=>`<option value="${i}" ${Number(p.phase)===i?'selected':''}>${i+1}. ${esc(x)}</option>`).join('');openDlg(id?'Projekt bearbeiten':'Projekt anlegen',`<div class="form"><label>Projektname<input id="pTitle" value="${esc(p.title||'')}" placeholder="z. B. STOROJET Meier Medizintechnik"></label><label>Kunde<select id="pCustomer"><option value="">Kunde auswählen …</option>${customerOpts}</select></label><div class="cols"><label>Aktuelle Phase<select id="pPhase">${phaseOpts}</select></label><label>Status<select id="pStatus"><option value="active" ${p.status!=='completed'?'selected':''}>Laufend</option><option value="completed" ${p.status==='completed'?'selected':''}>Abgeschlossen</option></select></label></div><div class="cols"><label>Projektleitung<input id="pManager" value="${esc(p.projectManager||'')}"></label><label>Account Manager<input id="pAccount" value="${esc(p.accountManager||'')}"></label></div><div class="cols"><label>Ansprechpartner Kunde<input id="pClient" value="${esc(p.client||'')}"></label><label>Zieltermin<input id="pTarget" type="date" value="${esc(p.targetDate||'')}"></label></div><label>Notiz / Besonderheiten<textarea id="pNotes">${esc(p.notes||'')}</textarea></label></div>`,`<button class="btn" onclick="dlg.close()">Abbrechen</button><button class="btn primary" onclick="saveProject('${id||''}')">Speichern</button>`)}
async function saveProject(id){let customerId=$('#pCustomer')?.value,title=$('#pTitle')?.value.trim();if(!customerId)return alert('Bitte einen Kunden auswählen.');if(!title)return alert('Bitte einen Projektnamen eingeben.');let p=id?S.projects.find(x=>x.id===id):{id:uid()};Object.assign(p,{customerId,title,phase:Number($('#pPhase').value),status:$('#pStatus').value,projectManager:$('#pManager').value.trim(),accountManager:$('#pAccount').value.trim(),client:$('#pClient').value.trim(),targetDate:$('#pTarget').value,notes:$('#pNotes').value.trim(),updatedAt:new Date().toISOString()});if(p.status==='completed')p.phase=projectPhases.length-1;if(!id)S.projects.push(p);await save();dlg.close();projectMode=p.status==='completed'?'completed':'active';projects();notify('Projekt gespeichert.')}

function googleDriveStatusText(){if(googleDriveAccessToken&&Date.now()<googleDriveTokenExpiresAt)return 'Google Drive verbunden';if(S.settings.googleDriveClientId)return 'nicht verbunden';return 'Client-ID fehlt'}
async function saveGoogleDriveSettings(){S.settings.googleDriveClientId=$('#googleDriveClientId')?.value.trim()||'';S.settings.googleDriveFolderName=$('#googleDriveFolderName')?.value.trim()||'STOROJET CRM Backups';S.settings.googleDriveAutoBackup=!!$('#googleDriveAutoBackup')?.checked;await save(true);settings();notify('Google-Drive-Einstellungen gespeichert.')}
function googleDriveTokenValid(){return !!googleDriveAccessToken&&Date.now()<googleDriveTokenExpiresAt-60000}
function connectGoogleDrive(){let clientId=$('#googleDriveClientId')?.value.trim()||S.settings.googleDriveClientId||'';if(!clientId)return alert('Bitte zuerst deine Google OAuth Client-ID eintragen und speichern.');S.settings.googleDriveClientId=clientId;if(typeof google==='undefined'||!google.accounts?.oauth2)return alert('Google Identity Services konnte nicht geladen werden. Bitte Seite neu laden.');return new Promise((resolve,reject)=>{try{googleDriveTokenClient=google.accounts.oauth2.initTokenClient({client_id:clientId,scope:'https://www.googleapis.com/auth/drive.file',callback:async resp=>{if(resp.error){reject(new Error(resp.error));return}googleDriveAccessToken=resp.access_token||'';googleDriveTokenExpiresAt=Date.now()+(Number(resp.expires_in)||3600)*1000;await save(true);settings();notify('Google Drive verbunden.');resolve(true)}});googleDriveTokenClient.requestAccessToken({prompt:'consent'})}catch(e){reject(e)}}).catch(e=>alert('Google-Drive-Anmeldung fehlgeschlagen: '+e.message))}
async function googleDriveFetch(url,options={}){if(!googleDriveTokenValid())throw new Error('Google Drive ist nicht verbunden oder die Sitzung ist abgelaufen.');let headers={...(options.headers||{}),Authorization:'Bearer '+googleDriveAccessToken},r=await fetch(url,{...options,headers});if(r.status===401){googleDriveAccessToken='';googleDriveTokenExpiresAt=0;throw new Error('Google-Drive-Sitzung ist abgelaufen. Bitte erneut verbinden.')}if(!r.ok){let txt=await r.text();throw new Error('Google Drive '+r.status+': '+txt.slice(0,300))}return r}
function googleDriveEscapeQuery(v){return String(v||'').replace(/\\/g,'\\\\').replace(/'/g,"\\'")}
async function ensureGoogleDriveFolder(){if(S.settings.googleDriveFolderId){try{await googleDriveFetch('https://www.googleapis.com/drive/v3/files/'+encodeURIComponent(S.settings.googleDriveFolderId)+'?fields=id,name,trashed');return S.settings.googleDriveFolderId}catch(_){S.settings.googleDriveFolderId=''}}let name=S.settings.googleDriveFolderName||'STOROJET CRM Backups',q="name='"+googleDriveEscapeQuery(name)+"' and mimeType='application/vnd.google-apps.folder' and trashed=false",r=await googleDriveFetch('https://www.googleapis.com/drive/v3/files?q='+encodeURIComponent(q)+'&spaces=drive&fields=files(id,name)&pageSize=10'),j=await r.json();if(j.files?.length){S.settings.googleDriveFolderId=j.files[0].id;return j.files[0].id}r=await googleDriveFetch('https://www.googleapis.com/drive/v3/files?fields=id,name',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,mimeType:'application/vnd.google-apps.folder'})});j=await r.json();S.settings.googleDriveFolderId=j.id;return j.id}
async function findGoogleDriveFile(name,folderId){let q="name='"+googleDriveEscapeQuery(name)+"' and '"+googleDriveEscapeQuery(folderId)+"' in parents and trashed=false",r=await googleDriveFetch('https://www.googleapis.com/drive/v3/files?q='+encodeURIComponent(q)+'&spaces=drive&fields=files(id,name,modifiedTime)&pageSize=10'),j=await r.json();return j.files?.[0]||null}
async function createGoogleDriveJson(name,folderId,jsonText){let boundary='crm_'+Date.now(),meta={name,parents:[folderId],mimeType:'application/json'},body='--'+boundary+'\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n'+JSON.stringify(meta)+'\r\n--'+boundary+'\r\nContent-Type: application/json\r\n\r\n'+jsonText+'\r\n--'+boundary+'--';let r=await googleDriveFetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,name',{method:'POST',headers:{'Content-Type':'multipart/related; boundary='+boundary},body});return await r.json()}
async function updateGoogleDriveJson(fileId,jsonText){let r=await googleDriveFetch('https://www.googleapis.com/upload/drive/v3/files/'+encodeURIComponent(fileId)+'?uploadType=media&fields=id,name,modifiedTime',{method:'PATCH',headers:{'Content-Type':'application/json'},body:jsonText});return await r.json()}
function crmBackupJson(){return JSON.stringify(S,null,2)}
function scheduleGoogleDriveBackup(){if(!S.settings.googleDriveAutoBackup||!googleDriveTokenValid())return;clearTimeout(googleDriveBackupTimer);googleDriveBackupTimer=setTimeout(()=>backupToGoogleDrive(false),45000)}
async function backupToGoogleDrive(showFeedback=false){if(googleDriveBackupBusy)return;if(!googleDriveTokenValid()){if(showFeedback)alert('Bitte Google Drive zuerst verbinden.');return}googleDriveBackupBusy=true;try{let folderId=await ensureGoogleDriveFolder(),json=crmBackupJson(),latestName='STOROJET_CRM_latest.json',latestId=S.settings.googleDriveLatestFileId||'',latestFile=latestId?{id:latestId}:await findGoogleDriveFile(latestName,folderId);if(latestFile?.id){try{await updateGoogleDriveJson(latestFile.id,json);S.settings.googleDriveLatestFileId=latestFile.id}catch(e){latestFile=await createGoogleDriveJson(latestName,folderId,json);S.settings.googleDriveLatestFileId=latestFile.id}}else{latestFile=await createGoogleDriveJson(latestName,folderId,json);S.settings.googleDriveLatestFileId=latestFile.id}let day=today(),dailyName='STOROJET_CRM_'+day+'.json';if(S.settings.googleDriveDailyDate!==day||!S.settings.googleDriveDailyFileId){let existing=await findGoogleDriveFile(dailyName,folderId);if(existing?.id){S.settings.googleDriveDailyFileId=existing.id;S.settings.googleDriveDailyDate=day;await updateGoogleDriveJson(existing.id,json)}else{let created=await createGoogleDriveJson(dailyName,folderId,json);S.settings.googleDriveDailyFileId=created.id;S.settings.googleDriveDailyDate=day}}else{try{await updateGoogleDriveJson(S.settings.googleDriveDailyFileId,json)}catch(_){let created=await createGoogleDriveJson(dailyName,folderId,json);S.settings.googleDriveDailyFileId=created.id}}S.settings.googleDriveLastBackupAt=new Date().toISOString();await save(true);if(showFeedback){settings();notify('Google-Drive-Sicherung abgeschlossen.')}}catch(e){console.error(e);if(showFeedback)alert('Google-Drive-Sicherung fehlgeschlagen: '+e.message)}finally{googleDriveBackupBusy=false}}
async function restoreLatestGoogleDriveBackup(){if(!googleDriveTokenValid())return alert('Bitte Google Drive zuerst verbinden.');try{let folderId=await ensureGoogleDriveFolder(),fileId=S.settings.googleDriveLatestFileId||'',file=fileId?{id:fileId}:await findGoogleDriveFile('STOROJET_CRM_latest.json',folderId);if(!file?.id)return alert('Es wurde noch kein Cloud-Backup gefunden.');let r=await googleDriveFetch('https://www.googleapis.com/drive/v3/files/'+encodeURIComponent(file.id)+'?alt=media'),cloud=await r.json();if(!cloud||!Array.isArray(cloud.customers))return alert('Das Cloud-Backup ist ungültig.');if(!confirm('Letztes Google-Drive-Backup wiederherstellen? Der aktuelle Stand wird vorher lokal gesichert.'))return;S.backups=Array.isArray(S.backups)?S.backups:[];S.backups.push({at:new Date().toISOString(),reason:'Sicherung vor Google-Drive-Wiederherstellung',data:JSON.parse(JSON.stringify({customers:S.customers,todos:S.todos,activities:S.activities,projects:S.projects,tasks:S.tasks,timeEntries:S.timeEntries,timeReports:S.timeReports,followupDrafts:S.followupDrafts,settings:S.settings}))});let driveSettings={googleDriveClientId:S.settings.googleDriveClientId,googleDriveAutoBackup:S.settings.googleDriveAutoBackup,googleDriveFolderName:S.settings.googleDriveFolderName,googleDriveFolderId:S.settings.googleDriveFolderId,googleDriveLatestFileId:file.id,googleDriveDailyFileId:S.settings.googleDriveDailyFileId,googleDriveDailyDate:S.settings.googleDriveDailyDate,googleDriveLastBackupAt:S.settings.googleDriveLastBackupAt};S={...cloud,backups:[...(cloud.backups||[]),...S.backups].slice(-20)};normalize();Object.assign(S.settings,driveSettings);await save(true);render();notify('Google-Drive-Backup wiederhergestellt.')}catch(e){console.error(e);alert('Wiederherstellung fehlgeschlagen: '+e.message)}}
function backupRecoveryHtml(){let rows=(Array.isArray(S.backups)?S.backups:[]).map((b,i)=>({b,i})).reverse();if(!rows.length)return '<div class="empty">Keine lokalen Sicherungsstände vorhanden.</div>';return rows.map(({b,i})=>{let d=b?.data||{},cc=Array.isArray(d.customers)?d.customers.length:0,aa=Array.isArray(d.activities)?d.activities.length:0,tt=Array.isArray(d.todos)?d.todos.length:0;return '<div class="row"><div><div class="title">'+dt(b.at)+'</div><div class="sub">'+esc(b.reason||'Lokaler Sicherungsstand')+' · '+cc+' Kontakte · '+aa+' Historieneinträge · '+tt+' Doings</div></div><div class="todoActions"><button class="btn" onclick="mergeBackupData('+i+')">Fehlende Daten ergänzen</button><button class="btn danger" onclick="restoreBackupData('+i+')">Komplett wiederherstellen</button></div></div>'}).join('')}
function mergeUniqueById(current,incoming){let out=Array.isArray(current)?[...current]:[],ids=new Set(out.map(x=>x?.id).filter(Boolean));for(const x of (Array.isArray(incoming)?incoming:[])){if(x?.id&&ids.has(x.id))continue;out.push(JSON.parse(JSON.stringify(x)));if(x?.id)ids.add(x.id)}return out}
async function mergeBackupData(index){let b=S.backups?.[index],d=b?.data;if(!d)return alert('Sicherungsstand konnte nicht gelesen werden.');let before={c:S.customers.length,a:S.activities.length,t:S.todos.length,p:S.projects.length};let names=new Set(S.customers.map(c=>String(c.companyName||'').trim().toLowerCase()).filter(Boolean)),ids=new Set(S.customers.map(c=>c.id).filter(Boolean));for(const x of (Array.isArray(d.customers)?d.customers:[])){let n=String(x?.companyName||'').trim().toLowerCase();if((x?.id&&ids.has(x.id))||(n&&names.has(n)))continue;S.customers.push(JSON.parse(JSON.stringify(x)));if(x?.id)ids.add(x.id);if(n)names.add(n)}S.activities=mergeUniqueById(S.activities,d.activities);S.todos=mergeUniqueById(S.todos,d.todos);S.projects=mergeUniqueById(S.projects,d.projects);S.tasks=mergeUniqueById(S.tasks,d.tasks);S.timeEntries=mergeUniqueById(S.timeEntries,d.timeEntries);S.timeReports=mergeUniqueById(S.timeReports,d.timeReports);S.followupDrafts=mergeUniqueById(S.followupDrafts,d.followupDrafts);normalize();await save();let added={c:S.customers.length-before.c,a:S.activities.length-before.a,t:S.todos.length-before.t,p:S.projects.length-before.p};notify('Wiederherstellung: '+added.c+' Kontakte, '+added.a+' Historieneinträge, '+added.t+' Doings und '+added.p+' Projekte ergänzt.');settings()}

function normalizedCompanyName(c){return String(c?.companyName||'').trim().toLowerCase()}
function customerMatch(oldCustomer){if(!oldCustomer)return null;if(oldCustomer.id){let byId=S.customers.find(c=>c.id===oldCustomer.id);if(byId)return byId}let n=normalizedCompanyName(oldCustomer);return n?S.customers.find(c=>normalizedCompanyName(c)===n)||null:null}
function comparableCustomer(c){let keys=['companyName','contactPerson','email','phone','mobilePhone','address','source','lastContact','firstContact','industry','nextSteps','reminderDate','sjSeen','info','inactive','website','erpSystem','salutation','firstOfferDate','secondOfferDate','sprinkler','footprint','waitingFor','productionSupply'];let o={};for(const k of keys)o[k]=c?.[k]??null;return o}
function recordFingerprint(x,type){if(x?.id)return 'id:'+x.id;if(type==='activity')return [x?.customerId,x?.type,x?.at,x?.text].join('|');if(type==='todo')return [x?.customerId,x?.title,x?.due,x?.done].join('|');if(type==='project')return [x?.customerId,x?.title,x?.phase,x?.status].join('|');return JSON.stringify(x||{})}
function missingRecords(current,incoming,type){let cur=new Set((Array.isArray(current)?current:[]).map(x=>recordFingerprint(x,type)));return (Array.isArray(incoming)?incoming:[]).filter(x=>!cur.has(recordFingerprint(x,type)))}
function calculateExternalComparison(oldData){let oldCustomers=Array.isArray(oldData?.customers)?oldData.customers:[],missingCustomers=[],changedCustomers=[],matchedOld=new Set(),matchedCurrent=new Set();for(const oc of oldCustomers){let cc=customerMatch(oc);if(!cc){missingCustomers.push(oc);continue}matchedOld.add(oc);matchedCurrent.add(cc);if(JSON.stringify(comparableCustomer(oc))!==JSON.stringify(comparableCustomer(cc)))changedCustomers.push({old:oc,current:cc})}let currentOnly=S.customers.filter(c=>!matchedCurrent.has(c));return{oldCounts:{customers:oldCustomers.length,activities:(oldData.activities||[]).length,todos:(oldData.todos||[]).length,projects:(oldData.projects||[]).length},currentCounts:{customers:S.customers.length,activities:S.activities.length,todos:S.todos.length,projects:S.projects.length},missingCustomers,currentOnly,changedCustomers,missingActivities:missingRecords(S.activities,oldData.activities,'activity'),missingTodos:missingRecords(S.todos,oldData.todos,'todo'),missingProjects:missingRecords(S.projects,oldData.projects,'project'),missingTasks:missingRecords(S.tasks,oldData.tasks,'task')}}
function externalCompareHtml(){let r=externalCompareResult;if(!r)return'';let missingNames=r.missingCustomers.slice(0,30).map(c=>esc(c.companyName||'Ohne Firmenname')).join(', '),changedNames=r.changedCustomers.slice(0,20).map(x=>esc(x.current?.companyName||x.old?.companyName||'')).join(', ');return '<div class="notice"><b>Vergleich abgeschlossen</b><br>Alte Datei: '+r.oldCounts.customers+' Kontakte · Aktuell: '+r.currentCounts.customers+' Kontakte</div><div class="statGrid" style="margin-top:12px"><div class="statCard danger"><div class="statIcon">＋</div><b>'+r.missingCustomers.length+'</b><span>fehlen aktuell</span></div><div class="statCard"><div class="statIcon">↔</div><b>'+r.changedCustomers.length+'</b><span>Kunden abweichend</span></div><div class="statCard"><div class="statIcon">◷</div><b>'+r.missingActivities.length+'</b><span>Historieneinträge fehlen</span></div><div class="statCard"><div class="statIcon">☑</div><b>'+r.missingTodos.length+'</b><span>Doings fehlen</span></div></div>'+(r.missingCustomers.length?'<p><b>Fehlende Kunden:</b><br><span class="sub">'+missingNames+(r.missingCustomers.length>30?' …':'')+'</span></p>':'')+(r.changedCustomers.length?'<p><b>Abweichende Kunden:</b><br><span class="sub">'+changedNames+(r.changedCustomers.length>20?' …':'')+'</span></p>':'')+'<p class="sub">Zusätzlich fehlen '+r.missingProjects.length+' Projekte. Aktuelle Daten werden beim Ergänzen nicht überschrieben.</p><button class="btn primary" onclick="mergeExternalComparison()">Fehlende Daten übernehmen</button>'}
async function compareExternalBackup(){let f=$('#compareImp')?.files?.[0];if(!f)return alert('Bitte eine ältere JSON-Sicherung auswählen.');try{let x=JSON.parse(await f.text());if(!x||!Array.isArray(x.customers))return alert('Die ausgewählte Datei enthält keinen gültigen CRM-Kundenbestand.');externalCompareData=x;externalCompareResult=calculateExternalComparison(x);let box=$('#compareResult');if(box)box.innerHTML=externalCompareHtml()}catch(e){console.error(e);alert('Die Sicherung konnte nicht gelesen werden: '+e.message)}}
async function mergeExternalComparison(){if(!externalCompareData||!externalCompareResult)return alert('Bitte zuerst eine Sicherung vergleichen.');let r=externalCompareResult;if(!confirm(r.missingCustomers.length+' fehlende Kunden sowie fehlende Historieneinträge, Doings und Projekte aus der alten Datei ergänzen? Aktuelle Kundendaten werden nicht überschrieben.'))return;S.backups=Array.isArray(S.backups)?S.backups:[];S.backups.push({at:new Date().toISOString(),reason:'Sicherung vor Abgleich mit externer Altdatei',data:JSON.parse(JSON.stringify({customers:S.customers,todos:S.todos,activities:S.activities,projects:S.projects,tasks:S.tasks,timeEntries:S.timeEntries,timeReports:S.timeReports,followupDrafts:S.followupDrafts,settings:S.settings}))});S.backups=S.backups.slice(-20);for(const oc of r.missingCustomers)S.customers.push(JSON.parse(JSON.stringify(oc)));S.activities=mergeUniqueById(S.activities,r.missingActivities);S.todos=mergeUniqueById(S.todos,r.missingTodos);S.projects=mergeUniqueById(S.projects,r.missingProjects);S.tasks=mergeUniqueById(S.tasks,r.missingTasks);syncLegacy();syncLegacyProjects();normalize();await save();let summary='Ergänzt: '+r.missingCustomers.length+' Kontakte, '+r.missingActivities.length+' Historieneinträge, '+r.missingTodos.length+' Doings und '+r.missingProjects.length+' Projekte.';externalCompareData=null;externalCompareResult=null;settings();notify(summary)}
async function importJson(){let f=$('#imp').files[0];if(!f)return alert('Bitte JSON-Datei auswählen.');S.backups=Array.isArray(S.backups)?S.backups:[];S.backups.push({at:new Date().toISOString(),reason:'Sicherung vor JSON-Import',data:JSON.parse(JSON.stringify({customers:S.customers,todos:S.todos,activities:S.activities,projects:S.projects,tasks:S.tasks,timeEntries:S.timeEntries,timeReports:S.timeReports,followupDrafts:S.followupDrafts,settings:S.settings}))});S.backups=S.backups.slice(-20);let x=JSON.parse(await f.text());S.customers=x.customers||[];S.todos=x.todos||[];S.activities=x.activities||[];S.tasks=x.tasks||[];S.timeEntries=x.timeEntries||[];S.timeReports=x.timeReports||[];S.followupDrafts=x.followupDrafts||[];S.settings={...S.settings,...(x.settings||{})};S.projects=x.projects||[];syncLegacy();syncLegacyProjects();await save();alert('Import abgeschlossen: '+S.customers.length+' Kontakte.');render()}
function exportJson(){let blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='STOROJET_CRM_Backup_'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
async function makeBackup(){S.backups.push({at:new Date().toISOString(),data:JSON.parse(JSON.stringify({customers:S.customers,todos:S.todos,activities:S.activities,projects:S.projects,tasks:S.tasks,timeEntries:S.timeEntries,timeReports:S.timeReports,followupDrafts:S.followupDrafts,settings:S.settings}))});S.backups=S.backups.slice(-20);await save();alert('Lokaler Sicherungsstand erstellt.')}
async function clearAll(){if(!confirm('Wirklich alle lokalen CRM-Daten in diesem Browser löschen?'))return;S={customers:[],todos:[],activities:[],projects:[],tasks:[],timeEntries:[],timeReports:[],followupDrafts:[],settings:{sources:['Google','Website','LogiMAT','Empfehlung','Sonstiges'],stale:90},backups:[]};await save();render()}
async function ensureDailySafetyBackup(){S.backups=Array.isArray(S.backups)?S.backups:[];let last=[...S.backups].reverse().find(b=>b?.reason==='Automatische tägliche Sicherung');let lastDay=last?.at?String(last.at).slice(0,10):'';if(lastDay===today())return;S.backups.push({at:new Date().toISOString(),reason:'Automatische tägliche Sicherung',data:JSON.parse(JSON.stringify({customers:S.customers,todos:S.todos,activities:S.activities,projects:S.projects,tasks:S.tasks,timeEntries:S.timeEntries,timeReports:S.timeReports,followupDrafts:S.followupDrafts,settings:S.settings}))});S.backups=S.backups.slice(-20)}
async function cleanupLegacyAppCache(){try{if('serviceWorker' in navigator){let regs=await navigator.serviceWorker.getRegistrations();for(const reg of regs)await reg.unregister()}if('caches' in window){let keys=await caches.keys();for(const key of keys){if(key.startsWith('crm-pro-cache'))await caches.delete(key)}}}catch(e){console.warn('Cache-Bereinigung nicht möglich',e)}}
load().then(async()=>{await cleanupLegacyAppCache();syncLegacy();syncLegacyProjects();syncFollowupDrafts();await ensureDailySafetyBackup();await save();render()});
</script>
